<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的家族樹｜泰雅族譜建置系統｜宜蘭縣立大同國中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --red:#a8231c; --red-d:#7a1712; --black:#1f1a17; --earth:#8a5a3b; --sand:#f4ece0; --cream:#fbf7f1;
  --line:#5b4a3f; --muted:#6f625a; --gold:#d9a420; --male:#2f4858; --female:#a8231c; --ok:#2e6b3f;
  --fs:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:var(--fs);color:var(--black);background:var(--cream);line-height:1.6;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ===== 頁首（泰雅菱形紋） ===== */
.weave{height:14px;background:
  linear-gradient(135deg,var(--red) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(225deg,var(--red) 25%,transparent 25%) -7px 0/14px 14px,
  linear-gradient(315deg,var(--black) 25%,transparent 25%) 0 0/14px 14px,
  linear-gradient(45deg,var(--black) 25%,var(--sand) 25%) 0 0/14px 14px}
header.top{background:var(--black);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header.top .brand{display:flex;flex-direction:column;line-height:1.3}
header.top .school{font-size:15px;color:#e8d9c4;letter-spacing:.08em}
header.top h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.04em}
header.top h1 small{font-size:16px;font-weight:500;color:#f0b9a8;margin-left:10px}
header.top .who{margin-left:auto;font-size:17px;color:#e8d9c4;text-align:right}
header.top .who b{color:#fff}
.save-state{font-size:15px;color:#b9e3c3}
.save-state.warn{color:#ffcf8a}

/* ===== 工具列 ===== */
.toolbar{display:flex;flex-wrap:wrap;gap:7px;padding:10px 14px;background:var(--sand);border-bottom:2px solid #e2d3bf;align-items:center}
.btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:6px;min-height:48px;transition:transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--red);border-color:var(--red-d);color:#fff}
.btn.dark{background:var(--black);border-color:var(--black);color:#fff}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:4px 10px;font-size:16px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.toolbar .sep{flex:1}
.zoomgrp{display:flex;gap:4px}
.zoomgrp .btn{min-width:48px;justify-content:center;padding:6px 8px}

/* ===== 主畫面 ===== */
.main{position:absolute;left:0;right:0;bottom:0;display:flex}
.viewport{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;
  background-color:#fbf7f1;background-image:radial-gradient(#e5d8c6 1.2px,transparent 1.2px);background-size:26px 26px}
.viewport.dragging{cursor:grabbing}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage #lines{position:absolute;left:0;top:0;overflow:visible}
.hint{position:absolute;left:14px;bottom:12px;background:rgba(255,255,255,.92);border:1.5px solid #d8c7b2;border-radius:12px;padding:6px 12px;font-size:16px;color:var(--muted);pointer-events:none}
.readonly-bar{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--black);color:#fff;border-radius:14px;padding:8px 10px 8px 16px;display:flex;gap:10px;align-items:center;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.25);flex-wrap:wrap;max-width:95%}
.readonly-bar .btn{min-height:40px;font-size:16px;color:var(--black)}
.readonly-bar .btn.primary{color:#fff}

/* ===== 卡片 ===== */
.card{position:absolute;width:224px;height:124px;background:#fff;border:2.5px solid #b9a690;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 6px rgba(60,40,20,.12);cursor:pointer;user-select:none;-webkit-user-select:none}
.card .kin{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:3px 10px;background:var(--sand);font-size:16px;font-weight:700;min-height:30px;white-space:nowrap}
.card .kin .term{font-style:italic;color:var(--red);font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
.card .cb{display:flex;gap:8px;padding:6px 8px 0 6px;align-items:flex-start}
.card .av{width:60px;height:60px;flex:none;border-radius:50%;overflow:hidden}
.card .av svg,.card .av img{width:100%;height:100%;display:block}
.card .av img{object-fit:cover}
.photorow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.photorow .pav{width:84px;height:84px;border-radius:50%;overflow:hidden;flex:none;border:2px solid #cdbba5;background:#f4ece0}
.photorow .pav img,.photorow .pav svg{width:100%;height:100%;display:block;object-fit:cover}
.photorow.dead .pav{filter:grayscale(1);opacity:.8}
.photorow .pbtns{display:flex;gap:8px;flex-wrap:wrap}
.card .tx{flex:1;min-width:0}
.card .tn{font-size:19px;font-weight:900;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.card .hn{font-size:16px;color:#4b403a;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.blank .av{opacity:.45}
.card .empty{color:#7a6c62;font-weight:500;font-size:16px}
.card .chips{position:absolute;right:8px;bottom:6px;display:flex;gap:4px;align-items:center}
.card .storyb{position:absolute;left:6px;bottom:5px;border:1.5px solid #b07a1e;background:#fdf1df;color:#7a4f0e;border-radius:8px;font-size:14px;font-weight:700;line-height:20px;padding:0 6px;cursor:pointer;font-family:inherit}
.card .storyb:hover{background:#f8e2bd}
.card .chips.tight span{font-size:12.5px!important;padding:0 4px!important}
.card .storyb.mini{left:42px;bottom:auto;top:58px;width:30px;height:30px;padding:0;border-radius:50%;font-size:15px;line-height:26px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sthead{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.stav{width:96px;height:96px;border-radius:50%;overflow:hidden;flex:none;border:3px solid #cdbba5;background:#f4ece0}
.stav img,.stav svg{width:100%;height:100%;display:block;object-fit:cover}
.stav.dead{filter:grayscale(1);opacity:.8}
.stk{color:var(--red);font-weight:900;font-size:19px}.stk span{font-style:italic;font-weight:400;margin-left:10px;color:var(--muted)}
.stn{font-size:26px;font-weight:900;line-height:1.3}
.sts{color:var(--muted);font-size:17px}
.sttext{font-size:21px;line-height:1.9;white-space:pre-wrap;background:#fffaf2;border-left:6px solid #b07a1e;padding:14px 18px;border-radius:0 12px 12px 0;min-height:120px}
.stnav{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;font-size:17px}
.stnav .btn:disabled{opacity:.35}
.storycount{font-size:15px;color:var(--muted);text-align:right}
.pg .stories{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4mm;height:164mm}
.pg .st{border:1.5px solid #cdbba5;border-radius:10px;padding:3mm 4mm;overflow:hidden;display:flex;flex-direction:column;gap:2mm}
.pg .st .h{display:flex;gap:3mm;align-items:center}
.pg .st .a{width:15mm;height:15mm;border-radius:50%;overflow:hidden;flex:none;background:#f4ece0;border:1px solid #cdbba5}
.pg .st .a img,.pg .st .a svg{width:100%;height:100%;display:block;object-fit:cover}
.pg .st .a.dead{filter:grayscale(1)}
.pg .st .k{color:#a8231c;font-weight:900;font-size:14px}
.pg .st .n{font-weight:900;font-size:17px;line-height:1.2}
.pg .st .x{font-size:13.5px;line-height:1.6;white-space:pre-wrap}
.card .chips span{font-size:14px;font-weight:700;border-radius:8px;padding:0 7px;line-height:22px;white-space:nowrap}
.card .g{color:#fff}
.card .tr{background:#f4ece0;color:#5b4a3f;border:1px solid #cdbba5;line-height:20px!important}
.card .ad{background:#fff;color:var(--ok);border:1.5px dashed var(--ok);line-height:19px!important}
.card .dc{background:#5f5650;color:#fff}
.card.dead .av{filter:grayscale(1);opacity:.8}
.card.dead{background:#f6f4f1}
.field select{width:100%;font-size:19px;padding:9px 10px;border:2px solid #cdbba5;border-radius:10px;background:#fffdf9}
.quick select{font-size:17px;padding:6px 8px;border:2px solid #cdbba5;border-radius:10px;background:#fff;min-height:42px;max-width:170px}
.rel{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #eadfcf}
.rel:last-child{border-bottom:none}
.rel>span{font-size:17px}
.seg2{display:flex;gap:6px}
.seg2 button{border:2px solid #cdbba5;background:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:16px;min-height:40px}
.seg2 button.on{background:var(--black);border-color:var(--black);color:#fff}
.seg2 button.on.warn{background:#6f625a;border-color:#6f625a}
.tnote{font-size:14.5px;color:#7a4a12;background:#fdf1df;border-radius:8px;padding:4px 8px;margin-top:6px}
.card.M{border-left:9px solid var(--male)} .card.M .g{background:var(--male)}
.card.F{border-left:9px solid var(--female)} .card.F .g{background:var(--female)}
.card.blank{border-style:dashed;background:#fffdf9}
.card.me{border-color:var(--red);border-width:3.5px;box-shadow:0 0 0 4px rgba(168,35,28,.15),0 4px 10px rgba(60,40,20,.2)}
.card.me .kin{background:var(--red);color:#fff}
.card.me .kin .term{color:#ffe1d6}
.card.sel{outline:5px solid var(--gold);outline-offset:3px}
.card.new{outline:5px dashed var(--ok);outline-offset:3px}
.card{-webkit-touch-callout:none}
.card.pressing{transform:scale(.97);transition:transform .25s}
.card.lift{z-index:50;transform:scale(1.06) rotate(-1.5deg);box-shadow:0 14px 30px rgba(40,25,10,.38);cursor:grabbing;outline:none}
.card.lift.nodrop{opacity:.55}
.card.drop{outline:4px dashed var(--gold);outline-offset:4px}
.dropbar{position:absolute;width:12px;border-radius:999px;background:var(--gold);box-shadow:0 0 0 3px #fff,0 0 12px rgba(0,0,0,.25);z-index:40;pointer-events:none}
.dropbar.hidden{display:none}
.quick{border:3px solid var(--ok);background:#eef7f0;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.quick .qh{font-size:18px;color:var(--ok);font-weight:700}
.quick .qh b{color:var(--black)}
.quick .qrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.quick .qrow .seg{flex:0 0 auto}
.quick .qrow .seg button{min-height:42px;padding:0 16px;font-size:17px}

/* ===== 側邊編輯面板 ===== */
.panel{width:400px;max-width:100%;background:#fff;border-left:3px solid #e2d3bf;overflow-y:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:24px;line-height:1.3}
.panel h2 .k{display:block;font-size:17px;color:var(--red);font-weight:700}
.phead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.phead .btn{flex:none}
details.more{border:2px solid #eadfcf;border-radius:12px;padding:6px 12px}
details.more summary{font-weight:700;cursor:pointer;font-size:17px;color:var(--muted)}
details.more[open]{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.field label{display:block;font-weight:700;font-size:17px;margin-bottom:4px}
.field input[type=text],.field input[type=number]{width:100%;font-size:20px;padding:10px 12px;border:2px solid #cdbba5;border-radius:10px;background:#fffdf9}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(168,35,28,.15)}
.field textarea{width:100%;font-size:19px;line-height:1.7;padding:10px 12px;border:2px solid #cdbba5;border-radius:10px;background:#fffdf9;font-family:inherit;resize:vertical;min-height:120px}
.field .note{font-size:15px;color:var(--muted);margin-top:4px}
.preview{background:var(--sand);border-radius:10px;padding:6px 12px;font-size:15px;margin-top:6px;color:var(--muted)}
.preview b{font-size:20px;color:var(--black);margin:0 4px}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:18px;margin-top:6px}
.check input{width:22px;height:22px}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:50px;border:2px solid #cdbba5;background:#fff;border-radius:12px;font-weight:700;font-size:19px}
.seg button.on.M{background:var(--male);border-color:var(--male);color:#fff}
.seg button.on.F{background:var(--female);border-color:var(--female);color:#fff}
.addgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.addgrid button{min-height:56px;border:2px dashed var(--earth);background:#fffaf3;border-radius:12px;font-weight:700;font-size:18px;color:var(--black)}
.addgrid button:hover:not(:disabled){background:#fdeee0;border-style:solid}
.addgrid button:disabled{opacity:.3;cursor:not-allowed}
.sect{font-weight:900;font-size:18px;border-left:6px solid var(--red);padding-left:8px;margin-top:4px}
.danger{border:2px solid var(--red);color:var(--red);background:#fff;border-radius:12px;min-height:48px;font-weight:700}

/* ===== 對話框 ===== */
.modal-bg{position:fixed;inset:0;background:rgba(31,26,23,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:calc(100dvh - 24px);max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal .mh{padding:0}
.modal .mh{display:flex;align-items:center;background:var(--black);color:#fff;flex:none}
.modal .mh h3{margin:0;padding:14px 20px;font-size:23px;flex:1}
.modal .mx{background:transparent;border:2px solid #fff6;color:#fff;border-radius:10px;min-width:46px;min-height:44px;margin-right:12px;font-size:20px;font-weight:700}
.modal .mb{padding:18px 20px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1 1 auto;min-height:0}
.modal .mf{padding:12px 20px 14px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;flex:none;border-top:2px solid #f0e6d8;background:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.terms-table{width:100%;border-collapse:collapse;font-size:17px}
.terms-table td,.terms-table th{border-bottom:1px solid #eadfcf;padding:6px 8px;text-align:left}
.terms-table input{width:100%;font-size:18px;padding:6px 8px;border:2px solid #cdbba5;border-radius:8px}
.cls-list{display:flex;flex-direction:column;gap:8px}
.cls-item{display:flex;align-items:center;gap:10px;border:2px solid #e2d3bf;border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.cls-item .nm{font-weight:900;font-size:19px}
.cls-item .meta{color:var(--muted);font-size:15px}
.cls-item .acts{margin-left:auto;display:flex;gap:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:#fff;padding:10px 18px;border-radius:14px;font-size:18px;z-index:80;max-width:90%;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.welcome-intro{background:var(--sand);border-radius:12px;padding:10px 14px;font-size:17px}
.obar{display:flex;flex:none;height:52px;border-radius:12px;overflow:hidden;margin:6px 0 12px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.obar span{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;min-width:3px}
.obar span.unk{background:repeating-linear-gradient(45deg,#cfc6bb 0 8px,#bdb3a7 8px 16px);color:#3d342e}
.olegend{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center;font-size:19px;margin-bottom:12px}
.olegend i{width:20px;height:20px;border-radius:5px;display:inline-block}
.olegend .fr{font-weight:900;font-size:22px;text-align:right}
.olegend .pc{color:var(--muted);font-size:17px;text-align:right}
.onote{background:#fdf1df;border-left:6px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:17px;margin:12px 0}
.otable{width:100%;border-collapse:collapse;font-size:17px}
.otable th,.otable td{border-bottom:1px solid #eadfcf;padding:6px 6px;text-align:left;vertical-align:top}
.otable th{background:var(--sand);font-size:16px}
.otable td.r{text-align:right;font-weight:700;white-space:nowrap}
.otable .why{color:var(--muted);font-size:15px}
.otable button{border:none;background:none;color:var(--red);font-weight:700;font-size:17px;padding:0;text-decoration:underline;cursor:pointer;text-align:left}
.oline{font-size:17px;margin-top:6px;display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center}
.oline b{font-weight:900}
.oinf{color:#8a5a12;font-size:15px;margin-left:4px}
.oinf-tag{display:inline-block;background:#b07a1e;color:#fff;font-size:14px;font-weight:700;border-radius:6px;padding:0 6px;margin-right:6px;line-height:20px}
.linkbtn{border:none;background:none;color:var(--red);font-weight:700;font-size:17px;padding:0;text-decoration:underline;cursor:pointer}

/* ===== 手機、直式平板 ===== */
@media (max-width:900px){
  .main{flex-direction:column}
  .panel{position:absolute;left:0;right:0;bottom:0;width:100%;max-height:58%;border-left:none;border-top:3px solid #e2d3bf;border-radius:18px 18px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.2);z-index:10}
  header.top h1{font-size:22px}
  header.top .who{margin-left:0;text-align:left}
}
/* 1100 以下：次要功能收進「☰ 更多」 */
#bMore{display:none}
.moremenu{position:absolute;right:0;top:54px;background:#fff;border:2px solid var(--line);border-radius:14px;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:40;min-width:230px;overflow:hidden}
.moremenu button{display:flex;gap:10px;align-items:center;width:100%;border:none;border-bottom:1px solid #eee;background:#fff;padding:12px 16px;font-size:18px;font-weight:700;text-align:left;min-height:52px}
.moremenu button:hover{background:var(--sand)}
.moremenu button:disabled{opacity:.35}
.morewrap{position:relative}
@media (max-width:1100px){
  .toolbar .sec{display:none}
  #bMore{display:inline-flex}
}

/* ===== 列印頁面（螢幕預覽與列印共用） ===== */
#print{display:none}
.pg{position:relative;width:279mm;height:188mm;overflow:hidden;background:#fff;color:#1f1a17;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg.list{height:auto;min-height:188mm;overflow:visible}
.pg .ph{display:flex;align-items:flex-end;gap:14px;border-bottom:3px solid var(--black);padding-bottom:4px;margin-bottom:6px}
.pg .ph .t{font-size:24px;font-weight:900;line-height:1.3}
.pg .ph .s{font-size:14px;color:#444}
.pg .ph .r{margin-left:auto;font-size:15px;text-align:right;line-height:1.4}
.pg .pw{height:5px;margin-bottom:6px}
.pg .treebox{width:100%;height:164mm;position:relative}
.pg .treebox.cut{outline:1px dashed #999}
.pg .treebox svg{width:100%;height:100%;display:block}
.pg .tilemap{display:inline-grid;gap:2px;vertical-align:middle;margin-left:8px}
.pg .tilemap i{width:12px;height:9px;background:#ddd;display:block}
.pg .tilemap i.on{background:var(--red)}
.pg .legend{margin-left:auto;font-size:12.5px;color:#444;padding:1px 8px;border:1px solid #ccc;border-radius:6px;white-space:nowrap;align-self:flex-end;margin-bottom:2px}
.pg .legend + .r{margin-left:10px}
.roster{width:100%;border-collapse:collapse;font-size:14px}
.roster th,.roster td{border:1px solid #888;padding:3px 6px;text-align:left}
.roster th{background:#eee5d8}
.roster tr{break-inside:avoid}
/* 列印預覽視窗 */
.popt{display:flex;flex-direction:column;gap:10px}
.popt .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.popt .grp>b{min-width:5.5em}

<body>
<div class="weave"></div>
<header class="top" id="top">
  <div class="brand">
    <span class="school">宜蘭縣立大同國中・泰雅族譜建置系統</span>
    <h1>我的家族樹<small>qutux ramu'・同一個血源</small></h1>
  </div>
  <div class="who" id="who"></div>
</header>
<div class="toolbar" id="toolbar">
  <button class="btn primary" id="bExport" title="把族譜存成檔案，交給老師">💾 <span class="t">匯出<span class="t2">檔案</span></span></button>
  <button class="btn sec" id="bImport" title="打開之前匯出的檔案">📂 <span class="t">開啟檔案</span></button>
  <button class="btn" id="bPrint" title="A4 橫式列印">🖨️ <span class="t">列印</span></button>
  <button class="btn sec" id="bTerms" title="族語稱謂對照表">🗣️ <span class="t">稱謂表</span></button>
  <button class="btn sec" id="bOrigin" title="依家人填的族籍，算出族群來源">🌱 <span class="t">族群來源</span></button>
  <div class="finder"><input type="search" id="find" placeholder="🔍 找家人" autocomplete="off"><div class="res hidden" id="findRes"></div></div>
  <span class="sep"></span>
  <div class="zoomgrp">
    <button class="btn" id="bOut" title="縮小">－</button>

    <button class="btn" id="bMe" title="回到「我」">⌖ <span class="t">我</span></button>
  </div>
  <button class="btn ghost sec" id="bHelp" title="使用說明">❓ <span class="t">說明</span></button>
  <button class="btn ghost sec" id="bTeacher" title="老師匯入全班的檔案">👩‍🏫 <span class="t">老師檢視</span></button>
  <button class="btn ghost sec" id="bNew" title="清除這台裝置上存的資料">🧹 <span class="t">清除資料</span></button>
  <div class="morewrap"><button class="btn" id="bMore" aria-haspopup="true">☰ <span class="t">更多</span></button><div class="moremenu hidden" id="moreMenu"></div></div>
  <input type="file" id="fileOne" accept=".json,application/json" class="hidden">

</div>

  <div class="viewport" id="vp">
    <div class="stage" id="stage"><svg id="lines"></svg><div id="cards"></div></div>
    <div class="hint" id="hint">點卡片：加家人、改名字　｜　按住卡片再拖：換兄弟姊妹順序　｜　拖空白處：移動　｜　滾輪：縮放</div>
    <div class="readonly-bar hidden" id="roBar"></div>
  </div>
  <aside class="panel hidden" id="panel"></aside>
</div>
<div id="print"></div>
<div id="modalRoot"></div>
<input type="file" id="filePhoto" accept="image/*" class="hidden">

<script>
/* ===== 族譜核心邏輯（純函式，可單獨測試） ===== */
const FT = (() => {
  const TERM_DEFS = [
    // key, 中文說明, 預設族語（賽考利克泰雅語）
    ['father', '爸爸', "yaba'"],
    ['mother', '媽媽', "yaya'"],
    ['grandfather', '爺爺／外公', 'yutas'],
    ['grandmother', '奶奶／外婆', 'yaki'],
    ['ancestorM', '曾祖父以上（男）', 'yutas'],
    ['ancestorF', '曾祖母以上（女）', 'yaki'],
    ['uncle', '伯伯／叔叔／舅舅', 'mama'],
    ['aunt', '姑姑／阿姨', 'yata'],
    ['olderBrother', '哥哥', 'qbsuyan mlikuy'],
    ['olderSister', '姊姊', 'qbsuyan kneril'],
    ['youngerSibling', '弟弟／妹妹', "sswe'"],
    ['child', '兒子／女兒', "laqi'"],
    ['grandchild', '孫子女', ''],
    ['spouse', '配偶', ''],
    ['uncleInLaw', '伯母／嬸嬸／舅媽／姑丈／姨丈', ''],
    ['cousin', '堂表兄弟姊妹', ''],
    ['nibling', '姪子女／外甥', ''],
    ['grandSibling', '叔公／姑婆／舅公／姨婆', ''],
  ];
  const DEFAULT_TERMS = Object.fromEntries(TERM_DEFS.map(d => [d[0], d[2]]));
  // 族籍選項：原住民族 16 族（依原民會公告）＋其他
  const TRIBES = ['泰雅族', '太魯閣族', '賽德克族', '賽夏族', '噶瑪蘭族', '阿美族', '布農族', '排灣族', '魯凱族', '卑南族',
    '鄒族', '邵族', '雅美族（達悟族）', '撒奇萊雅族', '拉阿魯哇族', '卡那卡那富族', '漢族', '新住民'];
  // 傳統上採「子連父名」的族
  const PATRONYMIC = ['泰雅族', '太魯閣族', '賽德克族', '賽夏族', '噶瑪蘭族'];
  function tribeShort(t) {
    if (!t) return '';
    if (t.startsWith('雅美族')) return '達悟';
    return t.replace(/族$/, '');
  }

  let _seq = 0;
  function newId() {
    _seq++;
    return 'p' + Date.now().toString(36) + _seq.toString(36) + Math.random().toString(36).slice(2, 5);
  }

  function makePerson(o = {}) {
    return {
      id: o.id || newId(),
      given: o.given || '',        // 族名（個人名）
      han: o.han || '',            // 漢名
      gender: o.gender || '',      // 'M' | 'F' | ''
      bo: o.bo == null ? null : o.bo, // 排行（家中第幾個孩子）
      fullOverride: o.fullOverride || '', // 手動輸入的完整族名
      fatherId: o.fatherId || null,
      motherId: o.motherId || null,
      spouses: o.spouses ? o.spouses.slice() : [],
      divorced: o.divorced ? o.divorced.slice() : [], // 已離婚的配偶（雙方都記）
      adoptF: !!o.adoptF,          // 和爸爸是收養關係
      adoptM: !!o.adoptM,          // 和媽媽是收養關係
      tribe: o.tribe || '',        // 族籍
      deceased: !!o.deceased,      // 已過世
      photo: safePhoto(o.photo),   // 相片（縮好的小圖，data URL）
      story: cleanStory(o.story),  // 小故事
    };
  }
  const STORY_MAX = 300, STORY_LINES = 12;
  // 小故事：最多 300 字、12 行（多的行接到第 12 行後面，列印時才放得進格子）
  function cleanStory(v) {
    if (typeof v !== 'string') return '';
    const ls = v.slice(0, STORY_MAX).split('\n');
    return (ls.length > STORY_LINES ? [...ls.slice(0, STORY_LINES - 1), ls.slice(STORY_LINES - 1).join(' ')] : ls).join('\n');
  }
  // 只接受圖片的 data URL（避免匯入的檔案夾帶其他東西），太大的不收
  const PHOTO_MAX = 300000;
  function safePhoto(v) {
    return typeof v === 'string' && v.length < PHOTO_MAX && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v) ? v : '';
  }
  // 拿掉相片（老師的全班清單存在裝置上時用）
  function stripPhotos(data) {
    const out = Object.assign({}, data, { people: {} });
    for (const id in data.people) out.people[id] = Object.assign({}, data.people[id], { photo: '' });
    return out;
  }

  function newTree(me) {
    const p = makePerson(me);
    return {
      app: 'datong-family-tree', version: 1,
      student: { cls: '', seat: '' },
      meId: p.id,
      people: { [p.id]: p },
      terms: {},
    };
  }

  /* ---------- 子連父名 ---------- */
  function tribalName(p, people) {
    if (!p) return '';
    if (p.fullOverride && p.fullOverride.trim()) return p.fullOverride.trim();
    const g = (p.given || '').trim();
    if (!g) return '';
    const f = p.fatherId ? people[p.fatherId] : null;
    const fg = f && (f.given || '').trim();
    return fg ? g + ' ' + fg : g;
  }

  /* ---------- 關係查詢 ---------- */
  function childrenOf(id, people) {
    return Object.values(people).filter(p => p.fatherId === id || p.motherId === id);
  }
  function parentsOf(p) { return [p.fatherId, p.motherId].filter(Boolean); }
  function neighbors(id, people) {
    const p = people[id]; const out = [];
    if (!p) return out;
    parentsOf(p).forEach(x => people[x] && out.push([x, 'P']));
    childrenOf(id, people).forEach(c => out.push([c.id, 'C']));
    p.spouses.forEach(s => people[s] && out.push([s, 'S']));
    return out;
  }
  function siblingsOf(id, people) {
    const p = people[id]; if (!p) return [];
    const par = parentsOf(p);
    if (!par.length) return [];
    return Object.values(people).filter(q => q.id !== id &&
      ((p.fatherId && q.fatherId === p.fatherId) || (p.motherId && q.motherId === p.motherId)));
  }

  /* ---------- 稱謂推算 ---------- */
  // 以「我」為起點找最短路徑（血緣優先：配偶邊權重較高）
  function paths(meId, people) {
    const dist = { [meId]: 0 }, prev = {}, done = new Set();
    const W = { P: 1, C: 1, S: 1.6 };
    while (true) {
      let u = null, best = Infinity;
      for (const k in dist) if (!done.has(k) && dist[k] < best) { best = dist[k]; u = k; }
      if (u == null) break;
      done.add(u);
      for (const [v, t] of neighbors(u, people)) {
        const nd = dist[u] + W[t];
        if (dist[v] == null || nd < dist[v] - 1e-9) { dist[v] = nd; prev[v] = [u, t]; }
      }
    }
    const res = {};
    for (const id in dist) {
      const chain = [id]; let steps = '';
      let cur = id;
      while (prev[cur]) { steps = prev[cur][1] + steps; cur = prev[cur][0]; chain.unshift(cur); }
      res[id] = { steps, chain };
    }
    return res;
  }

  function cmpBo(a, b) { // a 是否比 b 年長：true / false / null（不知道）
    if (a == null || b == null || a.bo == null || b.bo == null || a.bo === b.bo) return null;
    return a.bo < b.bo;
  }

  function kinOf(steps, chain, people, terms) {
    const T = k => ((terms && terms[k] != null && terms[k] !== '') ? terms[k] : (terms && k in terms ? '' : DEFAULT_TERMS[k])) || '';
    const P = i => people[chain[i]];
    const me = P(0), x = P(chain.length - 1);
    const g = x ? x.gender : '';
    const pick = (m, f, u) => g === 'M' ? m : g === 'F' ? f : u;
    const r = (zh, key) => ({ zh, term: key ? T(key) : '', key: key || '' });

    if (steps === '') return r('我');
    if (steps === 'P') {
      const adopted = (me.fatherId === x.id && me.adoptF) || (me.motherId === x.id && me.adoptM);
      return r(adopted ? pick('養父', '養母', '養父母') : pick('爸爸', '媽媽', '父母'), g === 'F' ? 'mother' : g === 'M' ? 'father' : '');
    }
    if (/^P+$/.test(steps)) {
      const n = steps.length;
      const maternal = P(1) && P(1).gender === 'F';
      const key = n === 2 ? pick('grandfather', 'grandmother', '') : pick('ancestorM', 'ancestorF', '');
      if (n === 2) return r(maternal ? pick('外公', '外婆', '外祖父母') : pick('爺爺', '奶奶', '祖父母'), key);
      if (n === 3) return r((maternal ? '外' : '') + pick('曾祖父', '曾祖母', '曾祖父母'), key);
      if (n === 4) return r((maternal ? '外' : '') + pick('高祖父', '高祖母', '高祖父母'), key);
      return r('祖先（往上第 ' + n + ' 代）', key);
    }
    if (steps === 'PC') {
      const older = cmpBo(x, me);
      if (older === true) return r(pick('哥哥', '姊姊', '兄姊'), pick('olderBrother', 'olderSister', ''));
      if (older === false) return r(pick('弟弟', '妹妹', '弟妹'), 'youngerSibling');
      return r(pick('兄弟', '姊妹', '手足'), '');
    }
    if (steps === 'PS') return r(pick('繼父', '繼母', '繼父母'));
    if (steps === 'PPC') {
      const par = P(1), paternal = par && par.gender === 'M';
      if (paternal) {
        if (g === 'F') return r('姑姑', 'aunt');
        const o = cmpBo(x, par);
        return r(o === true ? '伯伯' : o === false ? '叔叔' : '伯伯／叔叔', g === 'M' ? 'uncle' : '');
      }
      return r(pick('舅舅', '阿姨', '舅舅／阿姨'), pick('uncle', 'aunt', ''));
    }
    if (steps === 'PPCS') {
      const par = P(1), blood = P(3), paternal = par && par.gender === 'M';
      let zh;
      if (paternal) {
        if (blood && blood.gender === 'F') zh = '姑丈';
        else { const o = cmpBo(blood, par); zh = o === true ? '伯母' : o === false ? '嬸嬸' : '伯母／嬸嬸'; }
      } else zh = blood && blood.gender === 'F' ? '姨丈' : '舅媽';
      return r(zh, 'uncleInLaw');
    }
    if (steps === 'PPCC') {
      const par = P(1), mid = P(3);
      const tang = par && par.gender === 'M' && mid && mid.gender === 'M';
      return r((tang ? '堂' : '表') + pick('兄弟', '姊妹', '兄弟姊妹'), 'cousin');
    }
    if (steps === 'PPPC') {
      const gp = P(2);
      let zh;
      if (gp && gp.gender === 'F') zh = pick('舅公', '姨婆', '舅公／姨婆');
      else zh = pick('伯公／叔公', '姑婆', '伯叔公／姑婆');
      return r(zh, 'grandSibling');
    }
    if (steps === 'C') {
      const adopted = (x.fatherId === me.id && x.adoptF) || (x.motherId === me.id && x.adoptM);
      return r(adopted ? pick('養子', '養女', '養子女') : pick('兒子', '女兒', '孩子'), 'child');
    }
    if (steps === 'CC') {
      const mid = P(1), outer = mid && mid.gender === 'F';
      return r((outer ? '外' : '') + pick('孫子', '孫女', '孫子女'), 'grandchild');
    }
    if (steps === 'S') return (me.divorced || []).includes(x.id) ? r(pick('前夫', '前妻', '前配偶')) : r(pick('丈夫', '妻子', '配偶'), 'spouse');
    if (steps === 'PCC') {
      const sib = P(2), viaSister = sib && sib.gender === 'F';
      return r(viaSister ? pick('外甥', '外甥女', '外甥') : pick('姪子', '姪女', '姪子女'), 'nibling');
    }
    if (steps === 'PCS') {
      const sib = P(2), o = cmpBo(sib, me);
      if (sib && sib.gender === 'M') return r(o === true ? '嫂嫂' : o === false ? '弟媳' : '兄弟的配偶');
      if (sib && sib.gender === 'F') return r(o === true ? '姊夫' : o === false ? '妹夫' : '姊妹的配偶');
      return r('手足的配偶');
    }
    if (steps === 'SP') return r(pick('配偶的爸爸', '配偶的媽媽', '配偶的父母'));
    if (steps === 'CS') return r(pick('女婿', '媳婦', '孩子的配偶'));
    return r('親戚');
  }

  function kinMap(tree) {
    const ps = paths(tree.meId, tree.people);
    const out = {};
    for (const id in tree.people) {
      const pth = ps[id];
      out[id] = pth ? kinOf(pth.steps, pth.chain, tree.people, tree.terms) : { zh: '（未連上）', term: '', key: '' };
    }
    return out;
  }

  /* ---------- 新增家人 ---------- */
  function sibGroup(anchorId, people) {
    const a = people[anchorId];
    const list = [a, ...siblingsOf(anchorId, people)];
    return list;
  }
  function normalizeBo(list) {
    const sorted = list.slice().sort((a, b) => {
      const x = a.bo == null ? 1e9 : a.bo, y = b.bo == null ? 1e9 : b.bo;
      return x - y;
    });
    sorted.forEach((p, i) => { p.bo = i + 1; });
  }
  function link(people, a, b) {
    if (!a || !b || a === b) return;
    if (!people[a].spouses.includes(b)) people[a].spouses.push(b);
    if (!people[b].spouses.includes(a)) people[b].spouses.push(a);
  }

  // rel: father mother spouse son daughter olderBrother olderSister youngerBrother youngerSister
  // 回傳 { id, created:[ids], note }
  function addRelative(tree, anchorId, rel, opts = {}) {
    const people = tree.people, a = people[anchorId];
    if (!a) throw new Error('找不到這個人');
    const created = []; let note = '';
    const add = o => { const p = makePerson(o); people[p.id] = p; created.push(p.id); return p; };

    if (rel === 'father' || rel === 'mother') {
      const field = rel === 'father' ? 'fatherId' : 'motherId';
      const other = rel === 'father' ? 'motherId' : 'fatherId';
      if (a[field]) throw new Error(rel === 'father' ? '已經有爸爸了' : '已經有媽媽了');
      const p = add({ gender: rel === 'father' ? 'M' : 'F' });
      // 同一位另一半家長、還沒有這個家長的兄弟姊妹，一起接上
      const otherParent = a[other];
      const group = [a];
      if (otherParent) Object.values(people).forEach(q => { if (q.id !== a.id && q[other] === otherParent && !q[field]) group.push(q); });
      group.forEach(q => { q[field] = p.id; });
      if (otherParent) link(people, p.id, otherParent);
      if (group.length > 1) note = '兄弟姊妹也一起接上了';
      return { id: p.id, created, note };
    }
    if (rel === 'spouse') {
      const first = a.spouses.length === 0;
      const p = add({ gender: a.gender === 'M' ? 'F' : a.gender === 'F' ? 'M' : '' });
      link(people, a.id, p.id);
      // 第一位配偶：先前加的孩子如果還缺另一位家長，就一起接上（子女線從夫妻中間往下）
      if (first && a.gender) {
        const otherField = a.gender === 'M' ? 'motherId' : 'fatherId';
        const kids = childrenOf(a.id, people).filter(k => k.id !== p.id && !k[otherField]);
        kids.forEach(k => { k[otherField] = p.id; });
        if (kids.length) note = '之前加的孩子也一起接上這位配偶了';
      }
      return { id: p.id, created, note };
    }
    if (rel === 'son' || rel === 'daughter') {
      if (!a.gender) throw new Error('請先設定這個人的性別，才知道他是爸爸還是媽媽');
      const p = add({ gender: rel === 'son' ? 'M' : 'F' });
      const selfField = a.gender === 'M' ? 'fatherId' : 'motherId';
      const otherField = a.gender === 'M' ? 'motherId' : 'fatherId';
      p[selfField] = a.id;
      let op = opts.otherParentId;
      if (op === undefined) op = a.spouses.length === 1 ? a.spouses[0] : null;
      if (op && people[op]) p[otherField] = op;
      const kids = childrenOf(a.id, people).filter(k => k.id !== p.id);
      const max = kids.reduce((m, k) => Math.max(m, k.bo || 0), 0);
      p.bo = max + 1;
      return { id: p.id, created, note };
    }
    if (/^(older|younger)(Brother|Sister)$/.test(rel)) {
      if (!a.fatherId && !a.motherId) {
        const f = add({ gender: 'M' }), m = add({ gender: 'F' });
        a.fatherId = f.id; a.motherId = m.id; link(people, f.id, m.id);
        note = '兄弟姊妹要透過爸媽連起來，已先加上爸爸、媽媽的空白卡片';
      }
      const group = sibGroup(a.id, people);
      normalizeBo(group);
      const older = rel.startsWith('older');
      const p = add({ gender: rel.endsWith('Brother') ? 'M' : 'F', fatherId: a.fatherId, motherId: a.motherId, tribe: a.tribe });
      p.bo = a.bo + (older ? -0.5 : 0.5);
      normalizeBo([...group, p]);
      return { id: p.id, created, note };
    }
    throw new Error('不認得的關係：' + rel);
  }

  /* ---------- 拖拉換順序 ---------- */
  // 同一對父母（爸爸、媽媽都一樣）的孩子，依排行排好
  function unitSiblings(id, people) {
    const p = people[id]; if (!p || (!p.fatherId && !p.motherId)) return [];
    return Object.values(people).filter(q => q.fatherId === p.fatherId && q.motherId === p.motherId)
      .sort((a, b) => ((a.bo == null ? 1e9 : a.bo) - (b.bo == null ? 1e9 : b.bo)));
  }
  // 把 id 移到 afterId 後面（afterId 為 null：移到最前面）。
  // 只在這組兄弟姊妹原本佔的排行之間互換，同父異母／同母異父的手足排行不會被動到。
  function reorderSiblings(tree, id, afterId) {
    const people = tree.people;
    let group = unitSiblings(id, people);
    if (group.length < 2) return false;
    let slots = group.map(q => q.bo);
    if (slots.some(v => v == null) || new Set(slots).size !== slots.length) {
      normalizeBo(sibGroup(id, people)); group = unitSiblings(id, people); slots = group.map(q => q.bo);
    }
    const before = group.map(q => q.id).join();
    const rest = group.filter(q => q.id !== id);
    const at = afterId == null ? 0 : rest.findIndex(q => q.id === afterId) + 1;
    if (afterId != null && at === 0) return false;
    rest.splice(at, 0, people[id]);
    rest.forEach((q, i) => { q.bo = slots[i]; });
    return rest.map(q => q.id).join() !== before;
  }

  // 在排行欄位填數字：只收 1～30 的整數；和兄弟姊妹撞號時，原本那位（和後面連號的）往後移一位
  // 回傳被往後移的人的 id
  function setBirthOrder(tree, id, value) {
    const people = tree.people, p = people[id]; if (!p) return [];
    if (value == null || value === '') { p.bo = null; return []; }
    let n = Math.round(Number(value));
    if (!isFinite(n)) return [];
    n = Math.min(30, Math.max(1, n));
    const others = siblingsOf(id, people).filter(q => q.bo != null).sort((a, b) => a.bo - b.bo);
    const before = Object.fromEntries(others.map(q => [q.id, q.bo]));
    // 原本排行剛好是 1、2、3……沒有空號：當成「換到第 n 個」，其他人跟著往前或往後
    const k = others.length + 1, all = [...others.map(q => q.bo), p.bo].sort((a, b) => a - b);
    if (p.bo != null && n <= k && all.every((v, i) => v === i + 1)) {
      const rest = others.slice(); rest.splice(n - 1, 0, p);
      rest.forEach((q, i) => { q.bo = i + 1; });
      return others.filter(q => q.bo !== before[q.id]).map(q => q.id);
    }
    p.bo = n;
    // 由小到大檢查，確保不重複（中間空號保留，例如只填了老大和老三）
    const list = [...others.filter(q => q.bo < n), p, ...others.filter(q => q.bo >= n)];
    let prev = 0;
    list.forEach(q => { if (q.bo <= prev) q.bo = prev + 1; prev = q.bo; });
    return others.filter(q => q.bo !== before[q.id]).map(q => q.id);
  }

  /* ---------- 特殊關係 ---------- */
  function setDivorced(tree, a, b, on) {
    const P = tree.people; if (!P[a] || !P[b] || !P[a].spouses.includes(b)) return;
    [[a, b], [b, a]].forEach(([x, y]) => {
      const d = P[x].divorced = (P[x].divorced || []).filter(z => z !== y);
      if (on) d.push(y);
    });
  }
  function isDivorced(tree, a, b) { const p = tree.people[a]; return !!(p && (p.divorced || []).includes(b)); }
  function isAdopted(p) { return !!(p && ((p.fatherId && p.adoptF) || (p.motherId && p.adoptM))); }

  /* ---------- 刪除 ---------- */
  function connectedFrom(startId, people, skipId) {
    const seen = new Set([startId]); const q = [startId];
    while (q.length) {
      const u = q.shift();
      for (const [v] of neighbors(u, people)) if (v !== skipId && !seen.has(v)) { seen.add(v); q.push(v); }
    }
    return seen;
  }
  // 預覽：刪掉 id 之後，會跟著被移除（不再和「我」相連）的人
  function deletePreview(tree, id) {
    if (id === tree.meId) return null;
    const people = tree.people;
    // 模擬刪除
    const clone = {};
    for (const k in people) if (k !== id) {
      const p = people[k];
      clone[k] = Object.assign({}, p, {
        fatherId: p.fatherId === id ? null : p.fatherId,
        motherId: p.motherId === id ? null : p.motherId,
        spouses: p.spouses.filter(s => s !== id),
        divorced: (p.divorced || []).filter(s => s !== id),
      });
    }
    const keep = connectedFrom(tree.meId, clone);
    return Object.keys(clone).filter(k => !keep.has(k));
  }
  function deletePerson(tree, id) {
    const extra = deletePreview(tree, id);
    if (extra == null) throw new Error('不能刪除「我」');
    const gone = new Set([id, ...extra]);
    for (const k of gone) delete tree.people[k];
    for (const p of Object.values(tree.people)) {
      if (gone.has(p.fatherId)) p.fatherId = null;
      if (gone.has(p.motherId)) p.motherId = null;
      p.spouses = p.spouses.filter(s => !gone.has(s));
      p.divorced = (p.divorced || []).filter(s => !gone.has(s));
      if (!p.fatherId) p.adoptF = false;
      if (!p.motherId) p.adoptM = false;
    }
    return [...gone];
  }

  /* ---------- 排版 ---------- */
  const DIM = { W: 224, H: 124, coupleGap: 30, blockGap: 60, familyGap: 110, rowGap: 120 };

  function generations(tree) {
    const gen = { [tree.meId]: 0 }; const q = [tree.meId];
    while (q.length) {
      const u = q.shift();
      for (const [v, t] of neighbors(u, tree.people)) {
        if (gen[v] != null) continue;
        gen[v] = gen[u] + (t === 'P' ? -1 : t === 'C' ? 1 : 0);
        q.push(v);
      }
    }
    // 沒連上的人放在「我」這一代
    for (const id in tree.people) if (gen[id] == null) gen[id] = 0;
    return gen;
  }

  // 等差保序回歸（Pool Adjacent Violators）
  function isotonic(t, w) {
    const blocks = [];
    for (let i = 0; i < t.length; i++) {
      blocks.push({ v: t[i], w: w[i], n: 1 });
      while (blocks.length > 1 && blocks[blocks.length - 2].v > blocks[blocks.length - 1].v) {
        const b = blocks.pop(), a = blocks.pop();
        const ww = a.w + b.w;
        blocks.push({ v: (a.v * a.w + b.v * b.w) / ww, w: ww, n: a.n + b.n });
      }
    }
    const out = [];
    blocks.forEach(b => { for (let i = 0; i < b.n; i++) out.push(b.v); });
    return out;
  }

  // 只取一部分人（列印分支用）：關係線只保留在這群人之內
  function subsetPeople(people, only) {
    const out = {};
    for (const id of only) {
      const p = people[id]; if (!p) continue;
      out[id] = Object.assign({}, p, {
        fatherId: only.has(p.fatherId) ? p.fatherId : null,
        motherId: only.has(p.motherId) ? p.motherId : null,
        spouses: p.spouses.filter(s => only.has(s)),
        divorced: (p.divorced || []).filter(s => only.has(s)),
      });
    }
    return out;
  }

  function layout(tree, opts = {}) {
    const D = DIM;
    const fullGen = generations(tree);
    const people = opts.only ? subsetPeople(tree.people, opts.only) : tree.people;
    const gen = {}; Object.keys(people).forEach(i => gen[i] = fullGen[i]);
    const ids = Object.keys(people);
    const kidsIdx = {}; ids.forEach(i => kidsIdx[i] = []);
    ids.forEach(i => { const p = people[i]; [p.fatherId, p.motherId].forEach(x => { if (x && kidsIdx[x]) kidsIdx[x].push(i); }); });
    const nb = id => { const p = people[id]; const out = [];
      [p.fatherId, p.motherId].forEach(x => x && out.push([x, 'P']));
      kidsIdx[id].forEach(c => out.push([c, 'C']));
      p.spouses.forEach(s => out.push([s, 'S'])); return out; };
    const startId = people[tree.meId] ? tree.meId : ids[0];
    // 夫妻併成一個區塊（同一代）
    const parent = {}; ids.forEach(i => parent[i] = i);
    const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
    ids.forEach(i => people[i].spouses.forEach(s => { if (people[s] && gen[s] === gen[i]) parent[find(i)] = find(s); }));
    const groups = {};
    ids.forEach(i => { const r = find(i); (groups[r] = groups[r] || []).push(i); });
    // 探索順序（從「我」出發），排夫妻順序和初始位置都會用到
    const order = {}; let k = 0;
    { const seen = new Set([startId]); const q = [startId];
      while (q.length) { const u = q.shift(); order[u] = k++; for (const [v] of nb(u)) if (!seen.has(v)) { seen.add(v); q.push(v); } }
      ids.forEach(i => { if (order[i] == null) order[i] = k++; }); }
    // 夫妻區塊內的左右順序
    function orderSpouses(members) {
      if (members.length === 1) return members;
      const set = new Set(members);
      const adj = {}; members.forEach(m => adj[m] = people[m].spouses.filter(s => set.has(s)));
      const deg = m => adj[m].length;
      // 男左女右的「順眼程度」
      const score = arr => arr.reduce((sc, m, i) => sc + (i && people[arr[i - 1]].gender === 'M' && people[m].gender === 'F' ? 1 : 0), 0);
      const isPath = members.every(m => deg(m) <= 2) && members.filter(m => deg(m) === 1).length === 2;
      if (isPath) {
        // 一串婚姻（例如 繼父－媽媽－爸爸－繼母）：照順序排，每對夫妻都相鄰
        const ends = members.filter(m => deg(m) === 1).sort((a, b) => order[a] - order[b]);
        const path = [ends[0]]; let prev = null, cur = ends[0];
        while (path.length < members.length) {
          const nx = adj[cur].find(v => v !== prev && !path.includes(v)); if (!nx) break;
          path.push(nx); prev = cur; cur = nx;
        }
        if (path.length === members.length) {
          const rev = path.slice().reverse();
          return score(rev) > score(path) ? rev : path;
        }
      }
      // 一個人有好幾位配偶：這個人放中間
      const hub = members.slice().sort((a, b) => (deg(b) - deg(a)) || (order[a] - order[b]))[0];
      const seen = new Set([hub]), out = [hub];
      const visit = u => adj[u].sort((a, b) => order[a] - order[b]).forEach(v => { if (!seen.has(v)) { seen.add(v); out.push(v); visit(v); } });
      visit(hub);
      members.forEach(m => { if (!seen.has(m)) out.push(m); });
      const others = out.slice(1), half = Math.ceil(others.length / 2);
      return [...others.slice(0, half).reverse(), hub, ...others.slice(half)];
    }
    const blocks = Object.values(groups).map(members => {
      const ordered = orderSpouses(members);
      return { members: ordered, gen: gen[members[0]], w: ordered.length * D.W + (ordered.length - 1) * D.coupleGap, x: 0 };
    });
    const blockOf = {}; blocks.forEach(b => b.members.forEach(m => blockOf[m] = b));
    const gens = [...new Set(blocks.map(b => b.gen))].sort((a, b) => a - b);
    const rows = {}; gens.forEach(g => rows[g] = []);
    blocks.forEach(b => rows[b.gen].push(b));
    gens.forEach(g => rows[g].sort((a, b) => Math.min(...a.members.map(m => order[m])) - Math.min(...b.members.map(m => order[m]))));

    const memberX = id => { const b = blockOf[id]; const i = b.members.indexOf(id); return b.x + i * (D.W + D.coupleGap) + D.W / 2; };
    const center = b => b.x + b.w / 2;
    // 同一組兄弟姊妹之間用一般間距；不同家之間多留一點空
    const gapBefore = (row, i) => i === 0 ? 0 : (row[i - 1]._cl === row[i]._cl ? D.blockGap : D.familyGap);
    const compact = row => { let x = 0; row.forEach((b, i) => { x += gapBefore(row, i); b.x = x; x += b.w; }); };
    gens.forEach(g => compact(rows[g]));

    // ---- 兄弟姊妹分組：同一對父母的孩子是一組，組內照排行，整組一起移動 ----
    const unitOf = m => { const p = people[m]; const f = p.fatherId && people[p.fatherId] ? p.fatherId : '', mo = p.motherId && people[p.motherId] ? p.motherId : '';
      return (f || mo) ? f + '|' + mo : null; };
    const minOrd = b => Math.min(...b.members.map(m => order[m]));
    blocks.forEach(b => { b._units = [...new Set(b.members.map(unitOf).filter(Boolean))]; });
    const rowCl = {};
    gens.forEach(g => {
      const row = rows[g]; const up = new Map(row.map(b => [b, b]));
      const f = b => { let r = b; while (up.get(r) !== r) r = up.get(r); up.set(b, r); return r; };
      const firstOf = {};
      row.forEach(b => b._units.forEach(u => { if (firstOf[u]) up.set(f(b), f(firstOf[u])); else firstOf[u] = b; }));
      const m = new Map();
      row.forEach(b => { const r = f(b); if (!m.has(r)) m.set(r, []); m.get(r).push(b); });
      rowCl[g] = [...m.values()].map((bl, ci) => { const cl = { blocks: bl, id: g + ':' + ci }; bl.forEach(b => b._cl = cl.id); return cl; });
    });
    const unitAnchor = u => { const ps = u.split('|').filter(Boolean); return ps.reduce((s, x) => s + memberX(x), 0) / ps.length; };
    // 一組（可能因為夫妻而連起兩組兄弟姊妹）裡面的左右順序
    const arrange = cl => {
      const units = {};
      cl.blocks.forEach(b => b._units.forEach(u => (units[u] = units[u] || []).push(b)));
      let uo = Object.keys(units);
      if (!uo.length) { cl.blocks.sort((a, b) => minOrd(a) - minOrd(b)); return; }
      uo.sort((a, b) => (unitAnchor(a) - unitAnchor(b)) || (a < b ? -1 : 1));
      if (uo.length === 2) {
        // 夫妻各自的兄弟姊妹：誰在夫妻左邊，誰那一家就排左邊（男左女右）
        const br = cl.blocks.find(b => b._units.includes(uo[0]) && b._units.includes(uo[1]));
        if (br) {
          const i0 = br.members.findIndex(m => unitOf(m) === uo[0]), i1 = br.members.findIndex(m => unitOf(m) === uo[1]);
          if (i1 < i0) uo = [uo[1], uo[0]];
        }
      }
      const boIn = (b, u) => { const m = b.members.find(mm => unitOf(mm) === u); const v = m && people[m].bo; return v == null ? 1e9 : v; };
      const placed = new Set(), seq = [];
      uo.forEach((u, i) => {
        const next = uo[i + 1];
        const mine = units[u].filter(b => !placed.has(b));
        const srt = arr => arr.sort((a, b) => (boIn(a, u) - boIn(b, u)) || (minOrd(a) - minOrd(b)));
        const toNext = srt(mine.filter(b => next && b._units.includes(next)));
        const rest = srt(mine.filter(b => !toNext.includes(b)));
        [...rest, ...toNext].forEach(b => { placed.add(b); seq.push(b); });
      });
      cl.blocks = seq;
    };
    const clCenter = cl => cl.blocks.reduce((s, b) => s + center(b), 0) / cl.blocks.length;
    const setRow = g => { rows[g] = rowCl[g].flatMap(cl => cl.blocks); compact(rows[g]); };
    gens.forEach(g => { rowCl[g].sort((a, b) => Math.min(...a.blocks.map(minOrd)) - Math.min(...b.blocks.map(minOrd))); rowCl[g].forEach(arrange); setRow(g); });

    const parentAnchor = id => {
      const p = people[id]; const ps = parentsOf(p).filter(x => people[x]);
      if (!ps.length) return null;
      return ps.reduce((s, x) => s + memberX(x), 0) / ps.length;
    };
    const childAnchor = b => {
      const xs = [];
      b.members.forEach(m => kidsIdx[m].forEach(c => { if (gen[c] === b.gen + 1) xs.push(memberX(c)); }));
      return xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null;
    };
    const keyDown = b => {
      const xs = b.members.map(parentAnchor).filter(v => v != null);
      return xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : center(b);
    };
    const place = (row, desired, weight) => {
      let off = 0; const o = [];
      row.forEach((b, i) => { off += gapBefore(row, i); o.push(off); off += b.w; });
      const t = row.map((b, i) => desired[i] - b.w / 2 - o[i]);
      const y = isotonic(t, weight);
      row.forEach((b, i) => { b.x = y[i] + o[i]; });
    };

    // 排序：上下來回的重心法（以「一組兄弟姊妹」為單位移動，組內順序固定照排行）
    const hasUnits = cl => cl.blocks.some(b => b._units.length);
    for (let it = 0; it < 6; it++) {
      for (let gi = 1; gi < gens.length; gi++) {
        const g = gens[gi];
        rowCl[g].forEach(arrange);
        const keyed = rowCl[g].map((cl, i) => {
          let k;
          if (hasUnits(cl)) { const xs = cl.blocks.map(keyDown); k = xs.reduce((s, x) => s + x, 0) / xs.length; }
          else k = clCenter(cl);
          return { cl, k, i };
        });
        keyed.sort((p, q) => (p.k - q.k) || (p.i - q.i));
        rowCl[g] = keyed.map(z => z.cl); setRow(g);
      }
      for (let gi = gens.length - 2; gi >= 0; gi--) {
        const g = gens[gi];
        // 往上這一趟只移動「沒有填父母」的那些人（例如最上面的祖先），兄弟姊妹的順序不受孩子位置影響
        const keyed = rowCl[g].map((cl, i) => {
          let k = clCenter(cl);
          if (!hasUnits(cl)) { const cs = cl.blocks.map(childAnchor).filter(v => v != null); if (cs.length) k = cs.reduce((s, x) => s + x, 0) / cs.length; }
          return { cl, k, i };
        });
        keyed.sort((p, q) => (p.k - q.k) || (p.i - q.i));
        rowCl[g] = keyed.map(z => z.cl); setRow(g);
      }
    }
    // 整張圖上下都沒有卡片的空白直條，縮成一般的家族間距（不影響上下對齊）
    const squeeze = () => {
      const iv = blocks.map(b => [b.x, b.x + b.w]).sort((a, b) => a[0] - b[0]);
      const cuts = []; let end = iv.length ? iv[0][1] : 0;
      for (let i = 1; i < iv.length; i++) {
        if (iv[i][0] - end > D.familyGap) cuts.push([end, iv[i][0] - end - D.familyGap]);
        end = Math.max(end, iv[i][1]);
      }
      if (!cuts.length) return;
      blocks.forEach(b => { let d = 0; cuts.forEach(([at, by]) => { if (b.x >= at) d += by; }); b.x -= d; });
    };
    // 位置：讓孩子在父母正下方、父母在孩子正上方
    for (let it = 0; it < 12; it++) {
      for (let gi = 1; gi < gens.length; gi++) {
        const row = rows[gens[gi]];
        const des = [], wt = [];
        row.forEach(b => {
          // 有父母的成員各自對準自己的父母（夫妻兩人都有父母時取中間，兩邊的家都拉得到）
          const ms = b.members.filter(mm => parentAnchor(mm) != null);
          if (ms.length) {
            const xs = ms.map(m => parentAnchor(m) - (memberX(m) - center(b)));
            des.push(xs.reduce((s, x) => s + x, 0) / xs.length); wt.push(1);
          } else { des.push(center(b)); wt.push(0.05); }
        });
        place(row, des, wt);
      }
      for (let gi = gens.length - 2; gi >= 0; gi--) {
        const row = rows[gens[gi]];
        const des = [], wt = [];
        row.forEach(b => { const c = childAnchor(b); if (c != null) { des.push(c); wt.push(1); } else { des.push(center(b)); wt.push(0.05); } });
        place(row, des, wt);
      }
      squeeze();
    }
    // 正規化
    let minX = Infinity, maxX = -Infinity;
    blocks.forEach(b => { minX = Math.min(minX, b.x); maxX = Math.max(maxX, b.x + b.w); });
    blocks.forEach(b => { b.x -= minX; });
    const g0 = gens[0];
    const pos = {};
    blocks.forEach(b => b.members.forEach((m, i) => {
      pos[m] = { x: b.x + i * (D.W + D.coupleGap), y: (b.gen - g0) * (D.H + D.rowGap), gen: b.gen };
    }));

    // 連線
    const lines = [];
    const doneCouple = new Set();
    ids.forEach(i => people[i].spouses.forEach(s => {
      const key = [i, s].sort().join('|');
      if (doneCouple.has(key) || !pos[s]) return; doneCouple.add(key);
      const a = pos[i], b = pos[s];
      if (a.y !== b.y) return;
      const [L, R] = a.x < b.x ? [a, b] : [b, a];
      lines.push({ type: 'marry', a: i, b: s, x1: L.x + D.W, y1: L.y + D.H / 2, x2: R.x, y2: R.y + D.H / 2, adjacent: R.x - L.x - D.W <= D.coupleGap + 1 });
    }));
    const units = {};
    ids.forEach(i => {
      const p = people[i]; if (!p.fatherId && !p.motherId) return;
      const key = (p.fatherId || '') + '|' + (p.motherId || '');
      (units[key] = units[key] || []).push(i);
    });
    const unitList = Object.entries(units);
    const byRow = {};
    unitList.forEach(([key, kids]) => {
      const ps = key.split('|').filter(Boolean).filter(x => pos[x]);
      if (!ps.length) return;
      const top = Math.max(...ps.map(x => pos[x].y));
      const ax = ps.reduce((s, x) => s + pos[x].x + D.W / 2, 0) / ps.length;
      const startY = ps.length === 2 && pos[ps[0]].y === pos[ps[1]].y ? top + D.H / 2 : top + D.H;
      const kx = kids.map(c => pos[c].x + D.W / 2);
      const ky = Math.min(...kids.map(c => pos[c].y));
      (byRow[ky] = byRow[ky] || []).push({ ax, startY, kx, ky, kids });
    });
    Object.values(byRow).forEach(list => {
      list.sort((a, b) => a.ax - b.ax);
      list.forEach((u, i) => {
        const n = list.length;
        const busY = u.ky - D.rowGap / 2 + (n > 1 ? (i - (n - 1) / 2) * Math.min(14, (D.rowGap - 40) / n) : 0);
        lines.push({ type: 'family', ax: u.ax, startY: u.startY, busY, kx: u.kx, ky: u.ky, kids: u.kids });
      });
    });
    const height = (gens[gens.length - 1] - g0) * (D.H + D.rowGap) + D.H;
    return { pos, lines, width: maxX - minX, height, dim: D, ids };
  }

  /* ---------- 列印分支 ---------- */
  // kind: 'all' | 'paternal' | 'maternal' | 'desc'（某人的後代，rootId）
  function branchIds(tree, kind, rootId) {
    const people = tree.people, all = new Set(Object.keys(people));
    if (kind === 'all') return all;
    if (kind === 'desc') {
      const out = new Set(); const q = [rootId];
      const kids = {}; Object.values(people).forEach(p => [p.fatherId, p.motherId].forEach(x => { if (x) (kids[x] = kids[x] || []).push(p.id); }));
      while (q.length) {
        const u = q.shift(); if (!people[u] || out.has(u)) continue; out.add(u);
        (kids[u] || []).forEach(c => q.push(c));
      }
      // 加上配偶（不再往下展開配偶那邊的親戚）
      [...out].forEach(u => people[u].spouses.forEach(s => out.add(s)));
      return out;
    }
    const me = people[tree.meId];
    const side = kind === 'paternal' ? me.fatherId : me.motherId;
    const other = kind === 'paternal' ? me.motherId : me.fatherId;
    if (!side) return new Set([tree.meId]);
    const ps = paths(tree.meId, people);
    const out = new Set();
    for (const id in ps) {
      const c = ps[id].chain;
      if (c.length === 1) out.add(id);                       // 我
      else if (c[1] === side) out.add(id);                   // 經過這一邊的家長
      else if (c[1] !== other) out.add(id);                  // 我的配偶、孩子
    }
    // 兄弟姊妹（可能先經過另一位家長才找到）、另一位家長本人
    siblingsOf(tree.meId, people).forEach(s => out.add(s.id));
    if (other) out.add(other);
    return out;
  }

  /* ---------- 族群來源 ---------- */
  // 依族籍一代一代往上平分：爸爸、媽媽各一半。
  // 收養的關係不算；沒填爸媽（或爸媽那邊沒有任何族籍資料）的部分，用這個人自己的族籍來算。
  // 回傳 { mix: {族籍: 比例}, src: [[人的 id, 比例]] }，src 是「用了誰的族籍、算了多少」
  function ancestry(tree, id) {
    const P = tree.people, memo = {}, onStack = new Set();
    const own = pid => ((P[pid] && P[pid].tribe) || '').trim();
    const merge = src => { const m = new Map(); src.forEach(([i, v]) => m.set(i, (m.get(i) || 0) + v)); return [...m.entries()]; };
    function calc(pid) {
      if (memo[pid]) return memo[pid];
      const p = P[pid];
      if (!p || onStack.has(pid)) return [[pid, 1]];
      onStack.add(pid);
      const f = p.fatherId && P[p.fatherId] && !p.adoptF ? p.fatherId : null;
      const m = p.motherId && P[p.motherId] && !p.adoptM ? p.motherId : null;
      let src;
      if (!f && !m) src = [[pid, 1]];
      else {
        src = [];
        [f, m].forEach(x => { if (x) calc(x).forEach(([i, v]) => src.push([i, v / 2])); else src.push([pid, 0.5]); });
        // 上面的祖先沒有填族籍：改用這個人自己的族籍
        if (own(pid)) {
          let gap = 0; src = src.filter(([i, v]) => { if (!own(i)) { gap += v; return false; } return true; });
          if (gap) src.push([pid, gap]);
        }
        src = merge(src);
      }
      onStack.delete(pid); memo[pid] = src;
      return src;
    }
    const src = calc(id).slice().sort((a, b) => b[1] - a[1]);
    const mix = {};
    src.forEach(([i, v]) => { const k = own(i); mix[k] = (mix[k] || 0) + v; });
    return { mix, src };
  }
  // 0.375 → '3/8'；1 → '1'
  function fracText(x) {
    if (Math.abs(x - 1) < 1e-9) return '1';
    for (let k = 1; k <= 16; k++) {
      const d = 2 ** k, n = x * d;
      if (Math.abs(n - Math.round(n)) < 1e-7) { let a = Math.round(n), b = d; while (a % 2 === 0 && b > 1) { a /= 2; b /= 2; } return a + '/' + b; }
    }
    return (x * 100).toFixed(1) + '%';
  }

  /* ---------- 檔案 ---------- */
  function validate(data) {
    if (!data || data.app !== 'datong-family-tree' || !data.people || !data.meId || !data.people[data.meId])
      throw new Error('這不是族譜系統匯出的檔案');
    for (const id in data.people) {
      const p = data.people[id];
      data.people[id] = makePerson(Object.assign({}, p, { id }));
    }
    for (const p of Object.values(data.people)) {
      // 排行只收 1～30 的整數
      if (p.bo != null) { const n = Math.round(Number(p.bo)); p.bo = isFinite(n) && n >= 1 ? Math.min(30, n) : null; }
      if (p.fatherId && !data.people[p.fatherId]) p.fatherId = null;
      if (p.motherId && !data.people[p.motherId]) p.motherId = null;
      p.spouses = p.spouses.filter(s => data.people[s] && s !== p.id);
      p.divorced = p.divorced.filter(s => p.spouses.includes(s));
      if (!p.fatherId) p.adoptF = false;
      if (!p.motherId) p.adoptM = false;
    }
    data.student = data.student || { cls: '', seat: '' };
    data.terms = data.terms || {};
    return data;
  }

  return { TERM_DEFS, DEFAULT_TERMS, makePerson, newTree, tribalName, childrenOf, siblingsOf, kinMap, addRelative,
    deletePreview, deletePerson, layout, generations, validate, isotonic, DIM, paths, branchIds, subsetPeople,
    TRIBES, PATRONYMIC, tribeShort, setDivorced, isDivorced, isAdopted, unitSiblings, reorderSiblings, safePhoto, stripPhotos, PHOTO_MAX, ancestry, fracText, setBirthOrder, STORY_MAX, cleanStory };
})();
if (typeof module !== 'undefined') module.exports = FT;

</script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY_MINE = 'datongFT.mine.v1', KEY_CLASS = 'datongFT.class.v1';

/* ---------- 儲存 ---------- */
let canStore = true;
function load(key) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { canStore = false; return null; } }
function store(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { canStore = false; return false; } }

let mine = null;        // 學生自己的族譜
let tree = null;        // 目前畫面上的族譜（自己的，或老師正在看的）
let viewing = null;     // 老師檢視中的項目
let selId = null;
let justAdded = null;   // 剛新增、還停在原本那個人的面板上
let view = { s: 1, x: 40, y: 40 };
let lastLayout = null;
let savedAt = null;

function saveMine() {
  if (!mine) return;
  mine.updatedAt = new Date().toISOString();
  const ok = store(KEY_MINE, mine);
  savedAt = ok ? new Date() : null;
  renderWho();
  return ok;
}

/* ---------- 相片 ---------- */
// 卡片每次重畫都用同一個短網址，不用每次重新解碼整張圖
const photoURLs = new Map();
function photoURL(d) {
  if (!d) return '';
  let u = photoURLs.get(d);
  if (!u) {
    try {
      const bin = atob(d.slice(d.indexOf(',') + 1)), arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      u = URL.createObjectURL(new Blob([arr], { type: d.slice(5, d.indexOf(';')) }));
    } catch (e) { u = d; }
    photoURLs.set(d, u);
  }
  return u;
}
// 縮成 160×160 的正方形小圖（直式照片偏上裁切，比較容易留住臉）
function shrinkPhoto(f) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      try {
        const w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h);
        if (!side) throw new Error('empty');
        const sx = (w - side) / 2, sy = h > w ? (h - side) * 0.25 : 0;
        // 先縮到中間大小再縮到最後大小，大張相片縮小後比較不會有鋸齒
        const mid = document.createElement('canvas'), M = Math.min(side, 480);
        mid.width = mid.height = M;
        const mg = mid.getContext('2d'); mg.imageSmoothingQuality = 'high'; mg.drawImage(img, sx, sy, side, side, 0, 0, M, M);
        const c = document.createElement('canvas'), N = 160; c.width = c.height = N;
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, N, N); g.imageSmoothingQuality = 'high'; g.drawImage(mid, 0, 0, M, M, 0, 0, N, N);
        URL.revokeObjectURL(url);
        const d = c.toDataURL('image/jpeg', 0.82);
        if (!FT.safePhoto(d)) throw new Error('bad');
        res(d);
      } catch (e) { URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad')); };
    img.src = url;
  });
}

/* ---------- 共用小工具 ---------- */
function toast(msg, ms = 2600) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function modal(title, bodyHTML, buttons, opts = {}) {
  const root = $('#modalRoot');
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" style="${opts.wide ? 'max-width:860px' : ''}"><div class="mh"><h3>${title}</h3>${opts.locked ? '' : '<button class="mx" aria-label="關閉" title="關閉（Esc）">✕</button>'}</div><div class="mb">${bodyHTML}</div><div class="mf"></div></div>`;
  if (opts.locked) bg.dataset.locked = '1';
  const mf = bg.querySelector('.mf');
  const close = () => bg.remove();
  buttons.forEach(b => {
    const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.innerHTML = b.label;
    el.onclick = () => { const r = b.onClick ? b.onClick(bg) : undefined; if (r !== false) close(); };
    mf.appendChild(el);
  });
  // 點背景關閉：要「按下」和「放開」都在背景上才算（觸控時，打開視窗的那一下會在背景補一個 click，不能把剛開的視窗關掉）
  let downOnBg = false;
  if (!opts.locked) { bg.addEventListener('pointerdown', e => { downOnBg = e.target === bg; }); bg.addEventListener('click', e => { if (e.target === bg && downOnBg) close(); downOnBg = false; }); bg.querySelector('.mx').onclick = close; }
  root.appendChild(bg);
  return { el: bg, close };
}
function confirmBox(title, html, okLabel, onOk, danger) {
  modal(title, html, [{ label: '取消' }, { label: okLabel, cls: danger ? 'primary' : 'dark', onClick: onOk }]);
}
const GENDER = { M: '男', F: '女' };
function displayName(p, people) { return FT.tribalName(p, people) || p.han || ''; }
function isBlank(p) { return !p.given && !p.han && !p.fullOverride; }
function today() { const d = new Date(); return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }

/* ---------- 頁首 ---------- */
function renderWho() {
  setTimeout(sizeMain, 0);
  if (!tree) { $('#who').innerHTML = ''; return; }
  const me = tree.people[tree.meId];
  const st = tree.student || {};
  const nm = displayName(me, tree.people) || '（未填名字）';
  const cnt = Object.keys(tree.people).length;
  let save = '';
  if (!viewing) save = canStore
    ? `<div class="save-state">✓ 已自動存在這台裝置${savedAt ? '（' + savedAt.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }) + '）' : ''}</div>`
    : `<div class="save-state warn">⚠ 這台裝置不能自動存檔，請記得「匯出檔案」</div>`;
  $('#who').innerHTML = `<div>${esc(st.cls || '')}${st.cls ? ' 班 ' : ''}${st.seat ? esc(st.seat) + ' 號　' : ''}<b>${esc(nm)}</b>${me.han && FT.tribalName(me, tree.people) ? '（' + esc(me.han) + '）' : ''}　共 ${cnt} 人</div>${save}`;
}

/* ---------- 人物小圖示（原創 SVG） ---------- */
function ageOf(gen) { return gen <= -2 ? 'elder' : gen === -1 ? 'adult' : 'young'; }
function avatarSVG(g, age) {
  const bg = g === 'M' ? '#dbe5ec' : g === 'F' ? '#f6ddd6' : '#ece4d8';
  const shirt = g === 'M' ? '#2f4858' : g === 'F' ? '#a8231c' : '#8a5a3b';
  const hair = age === 'elder' ? '#cfcac4' : '#2b2220';
  const skin = '#f0c8a0', young = age === 'young';
  const r = young ? 14.5 : 13.2, cy = young ? 29 : 28;
  let s = `<rect width="60" height="60" fill="${bg}"/>`;
  if (g === 'F' && age !== 'elder') s += `<path d="M15.5 ${cy} Q15 ${cy - 17} 30 ${cy - 17} Q45 ${cy - 17} 44.5 ${cy} L46 ${cy + 17} Q30 ${cy + 21} 14 ${cy + 17} Z" fill="${hair}"/>`;
  if (g === 'F' && young) s += `<circle cx="13.5" cy="${cy - 2}" r="4.2" fill="${hair}"/><circle cx="46.5" cy="${cy - 2}" r="4.2" fill="${hair}"/>`;
  s += `<path d="M7 62 Q9 44.5 30 44.5 Q51 44.5 53 62 Z" fill="${shirt}"/>`;
  // 菱形織紋的領口
  s += `<rect x="13" y="51" width="34" height="4.6" fill="#fff"/>`;
  for (let x = 16; x <= 44; x += 5.6) s += `<path d="M${x} 53.3 l2.3 -2.1 l2.3 2.1 l-2.3 2.1z" fill="${x % 2 < 1 ? '#a8231c' : '#1f1a17'}"/>`;
  s += `<rect x="26.5" y="${cy + 9}" width="7" height="${44.5 - cy - 8}" fill="${skin}"/>`;
  s += `<circle cx="30" cy="${cy}" r="${r}" fill="${skin}"/>`;
  if (g === 'M' && age === 'elder') s += `<path d="M${30 - r} ${cy + 1} Q${30 - r} ${cy - 9} ${30 - r + 5} ${cy - 11} L${30 - r + 5} ${cy - 2} Z" fill="${hair}"/><path d="M${30 + r} ${cy + 1} Q${30 + r} ${cy - 9} ${30 + r - 5} ${cy - 11} L${30 + r - 5} ${cy - 2} Z" fill="${hair}"/>`;
  else if (g === 'F' && age === 'elder') s += `<circle cx="30" cy="${cy - r - 2}" r="5.5" fill="${hair}"/><path d="M${30 - r - .5} ${cy} Q${30 - r} ${cy - r - 1} 30 ${cy - r - 1} Q${30 + r} ${cy - r - 1} ${30 + r + .5} ${cy} Q${30 + r - 3} ${cy - 8} 30 ${cy - 8} Q${30 - r + 3} ${cy - 8} ${30 - r - .5} ${cy} Z" fill="${hair}"/>`;
  else if (g === 'F') s += `<path d="M${30 - r - .5} ${cy + 1} Q${30 - r} ${cy - r - 1.5} 30 ${cy - r - 1.5} Q${30 + r} ${cy - r - 1.5} ${30 + r + .5} ${cy + 1} Q${30 + r - 2} ${cy - 7} 33 ${cy - 8} Q27 ${cy - 5} ${30 - r - .5} ${cy + 1} Z" fill="${hair}"/>`;
  else s += `<path d="M${30 - r - .3} ${cy - 1} Q${30 - r} ${cy - r - 2} 30 ${cy - r - 2} Q${30 + r} ${cy - r - 2} ${30 + r + .3} ${cy - 1} Q${30 + r - 2} ${cy - 8} 30 ${cy - 7.5} Q${30 - r + 3} ${cy - 8} ${30 - r - .3} ${cy - 1} Z" fill="${hair}"/>`;
  // 臉
  if (age === 'elder') s += `<path d="M23.6 ${cy} q2 -2 4 0 M32.4 ${cy} q2 -2 4 0" stroke="#3a2a22" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
  else s += `<circle cx="25.4" cy="${cy}" r="1.7" fill="#2b2220"/><circle cx="34.6" cy="${cy}" r="1.7" fill="#2b2220"/>`;
  s += `<path d="M25.8 ${cy + 5} Q30 ${cy + 8.5} 34.2 ${cy + 5}" stroke="#8a3b2a" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if (g === 'F' || young) s += `<circle cx="21.8" cy="${cy + 4}" r="2.2" fill="#e8907c" opacity=".45"/><circle cx="38.2" cy="${cy + 4}" r="2.2" fill="#e8907c" opacity=".45"/>`;
  return s;
}

/* ---------- 樹狀圖 ---------- */
function cardHTML(p, kin, pos, t) {
  const tn = FT.tribalName(p, t.people);
  // 右下角標籤很多時（例如已過世＋收養＋四個字的族名），標籤縮小、故事記號移到頭像角落
  const crowded = ((p.deceased ? 3 : 0) + (FT.isAdopted(p) ? 2 : 0) + (FT.tribeShort(p.tribe) || '').length + (p.gender ? 1 : 0)) >= 7;
  const cls = ['card', p.gender || '', p.id === t.meId ? 'me' : '', isBlank(p) ? 'blank' : '', p.id === selId ? 'sel' : '', p.id === justAdded ? 'new' : '', p.deceased ? 'dead' : ''].join(' ');
  return `<div class="${cls}" data-id="${p.id}" style="left:${pos.x}px;top:${pos.y}px">
    <div class="kin"><span>${esc(kin.zh)}</span>${kin.term ? `<span class="term">${esc(kin.term)}</span>` : ''}</div>
    <div class="cb"><div class="av">${p.photo ? `<img src="${esc(photoURL(p.photo))}" alt="" draggable="false">` : `<svg viewBox="0 0 60 60">${avatarSVG(p.gender, ageOf(pos.gen))}</svg>`}</div>
    <div class="tx"><div class="tn">${tn ? esc(tn) : '<span class="empty">（族名未填）</span>'}</div>
    <div class="hn">${p.han ? esc(p.han) : '<span class="empty">漢名未填</span>'}</div></div></div>
    ${(p.story || '').trim() ? (crowded
      ? `<button class="storyb mini" data-story="${p.id}" title="看小故事" aria-label="看小故事">📖</button>`
      : `<button class="storyb" data-story="${p.id}" title="看小故事">📖 故事</button>`) : ''}<div class="chips ${crowded ? 'tight' : ''}">${p.deceased ? '<span class="dc">已過世</span>' : ''}${FT.isAdopted(p) ? '<span class="ad">收養</span>' : ''}${p.tribe ? `<span class="tr">${esc(FT.tribeShort(p.tribe))}</span>` : ''}${p.gender ? `<span class="g">${GENDER[p.gender]}</span>` : ''}</div>
  </div>`;
}
function linesSVG(L, t) {
  let s = '';
  L.lines.forEach(l => {
    if (l.type === 'marry') {
      if (t && FT.isDivorced(t, l.a, l.b)) {

function applyView() { $('#stage').style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`; }
// 畫布上「真正看得到」的範圍（扣掉手機／直式平板下方的面板、左下角提示）
function visibleRect() {

  let bottom = vp.height;

  if (!pn.classList.contains('hidden') && window.innerWidth <= 900) bottom = Math.min(bottom, pn.getBoundingClientRect().top - vp.top);

}
function fitBox(x1, y1, x2, y2, maxS, minS) {
  const r = visibleRect(), pad = 28, padB = 52;
  const s = Math.min(maxS, (r.w - pad * 2) / Math.max(x2 - x1, 1), (r.h - pad - padB) / Math.max(y2 - y1, 1));
  view.s = Math.max(minS, s);
  view.x = (r.w - (x2 - x1) * view.s) / 2 - x1 * view.s;

}

}
function startView() {

}
function focusPerson(id, s) {
  if (!lastLayout || !lastLayout.pos[id]) return;
  const r = visibleRect();
  if (s) view.s = s;
  const p = lastLayout.pos[id], D = lastLayout.dim;
  view.x = r.w / 2 - (p.x + D.W / 2) * view.s;

}
function cardsOnScreen(ids) {
  const r = visibleRect(), D = lastLayout.dim;
  return ids.every(id => { const p = lastLayout.pos[id]; if (!p) return true;
    const x1 = view.x + p.x * view.s, y1 = view.y + p.y * view.s;
    return x1 >= 8 && y1 >= 8 && x1 + D.W * view.s <= r.w - 8 && y1 + D.H * view.s <= r.h - 8; });
}

  if (!lastLayout || !lastLayout.pos[id]) return;
  if (!cardsOnScreen([id])) focusPerson(id);

// 讓好幾張卡片同時出現在畫面上（新增家人後用）
function reveal(ids) {
  if (!lastLayout) return;

  if (!ids.length || cardsOnScreen(ids)) return;
  const D = lastLayout.dim, ps = ids.map(i => lastLayout.pos[i]);
  const x1 = Math.min(...ps.map(p => p.x)), y1 = Math.min(...ps.map(p => p.y));
  const x2 = Math.max(...ps.map(p => p.x)) + D.W, y2 = Math.max(...ps.map(p => p.y)) + D.H;

function tribeOptions(cur) {

    `<option value="__other" ${cur && !inList ? 'selected' : ''}>其他（自己填）</option>`;
}
function bindTribe(sel, other, person, onChange) {
  const sync = () => { other.classList.toggle('hidden', sel.value !== '__other'); };
  sync();
  sel.onchange = () => {
    if (sel.value === '__other') { person.tribe = other.value.trim(); sync(); other.focus(); }
    else { person.tribe = sel.value; other.value = ''; sync(); }

  };
  other.oninput = () => { person.tribe = other.value.trim(); onChange(); };

function doAdd(anchorId, rel) {
  const a = tree.people[anchorId];

    try {
      const r = FT.addRelative(tree, anchorId, rel, otherParentId === undefined ? {} : { otherParentId });

      saveMine(); renderTree(); renderPanel(true);
      // 原本那個人、新加的人、還有原本那個人的近親都留在畫面上
      const near = [anchorId, r.id, ...r.created, a.fatherId, a.motherId, ...a.spouses].filter(Boolean);
      reveal(near);
      if (r.note) toast(r.note, 4200);
    } catch (e) { toast('⚠ ' + e.message, 3600); }
  };
  if ((rel === 'son' || rel === 'daughter') && a.spouses.length > 1) {
    const opts = a.spouses.map(s => `<button class="btn" data-op="${s}" style="width:100%;justify-content:flex-start">${esc(displayName(tree.people[s], tree.people) || '（未填名字的配偶）')}</button>`).join('');

    m.el.querySelectorAll('[data-op]').forEach(b => b.onclick = () => { m.close(); go(b.dataset.op || null); });

  }
  go();
}

/* ---------- 匯出／匯入 ---------- */
function fileNameFor(t) {
  const me = t.people[t.meId], st = t.student || {};
  const nm = (me.han || FT.tribalName(me, t.people) || '未命名').replace(/[\\/:*?"<>|\s]+/g, '');
  return `族譜_${st.cls || ''}${st.seat ? '-' + String(st.seat).padStart(2, '0') : ''}_${nm}_${today()}.json`;
}
function exportMine() {
  if (!mine) return;
  saveMine();
  const blob = new Blob([JSON.stringify(mine, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileNameFor(mine);
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('已匯出：' + a.download + '　請把這個檔案交給老師', 5000);
}
function readFile(f) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { try { res(FT.validate(JSON.parse(r.result))); } catch (e) { rej(new Error(f.name + '：' + (e.message.includes('JSON') ? '檔案內容壞掉了' : e.message))); } };
    r.onerror = () => rej(new Error(f.name + '：讀不到檔案'));
    r.readAsText(f);
  });
}
$('#fileOne').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = await readFile(f);
    const apply = () => {
      document.querySelectorAll('.modal-bg').forEach(m => m.remove());
      mine = data; tree = mine; viewing = null; $('#roBar').classList.add('hidden');
      saveMine(); closePanel(); renderTree(); startView(); toast('已開啟檔案，可以繼續編輯');
    };
    if (mine && Object.keys(mine.people).length > 1) confirmBox('要用這個檔案取代目前的族譜嗎？', '<p>目前平板上的族譜會被換掉。如果還沒匯出，建議先按「取消」，匯出後再開啟。</p>', '取代', apply, true);
    else apply();
  } catch (err) { toast('⚠ ' + err.message, 4500); }
};

    .sort((a, b) => (G[a.id] - G[b.id]) || (L.pos[a.id].x - L.pos[b.id].x)).map(p => p.id);
}

      <div class="sttext">${esc(p.story)}</div>
      <div class="stnav"><button class="btn" id="stPrev" ${i === 0 ? 'disabled' : ''}>← 上一則</button><span>第 ${i + 1} / ${ids.length} 則</span><button class="btn" id="stNext" ${i === ids.length - 1 ? 'disabled' : ''}>下一則 →</button>
      ${viewing ? '' : '<button class="btn" id="stEdit" style="margin-left:auto">✏️ 修改</button>'}</div>`;
    $('#stPrev').onclick = () => { if (i > 0) { i--; draw(); } };

  };

// 列印故事頁：換行很多的故事字稍微縮小，才放得進格子（13.5px 時一行約 34 字、可放約 230px 高）
function storyFont(text) {
  for (const fs of [13.5, 12.5, 11.5, 10.5]) {
    const cpl = Math.floor(34 * 13.5 / fs);
    const lines = text.split('\n').reduce((a, l) => a + Math.max(1, Math.ceil(l.length / cpl)), 0);
    if (lines * fs * 1.6 <= 225) return fs;
  }
  return 10;
}
function storyPagesHTML(t, only) {

/* ---------- 族群來源 ---------- */
const OCOL = { '泰雅族': '#a8231c', '漢族': '#2f4858' };

function originColors(mix) {

// 把整棵樹畫成一張 SVG（列印用）

      <svg x="${x + 13}" y="${y + 37}" width="60" height="60" viewBox="0 0 60 60"><g ${isBlank(p) && !p.photo ? 'opacity=".45"' : p.deceased ? 'opacity=".8" filter="url(#ftGray)"' : ''}>${p.photo ? `<rect width="60" height="60" fill="#f4ece0"/><image href="${esc(p.photo)}" width="60" height="60" preserveAspectRatio="xMidYMid slice"/>` : avatarSVG(p.gender, ageOf(gen))}</g><path d="M-1 -1H61V61H-1Z M30 0.5A29.5 29.5 0 1 0 30.01 0.5Z" fill="#fff" fill-rule="evenodd"/></svg>

// 依選項算出要印的頁面
const TILE_SCALE = { mid: 0.55, big: 0.8 };
function planPages(t, o) {
  const only = o.range === 'all' ? null : FT.branchIds(t, o.range, o.root);
  const { L, body } = treeBody(t, only);
  const pad = 12, W = L.width + pad * 2, H = L.height + pad * 2;
  const fitS = Math.min(1, PAGE_W / W, PAGE_H / H);
  const rangeName = { all: '', paternal: '・爸爸那一邊', maternal: '・媽媽那一邊', desc: '・' + (o.root && t.people[o.root] ? displayName(t.people[o.root], t.people) + '的後代' : '後代') }[o.range];
  const pages = [];
  if (o.mode === 'fit' || fitS >= (TILE_SCALE[o.size] || .55)) {
    pages.push({ kind: 'tree', vb: [-pad, -pad, W, H], title: rangeName });
  } else {
    const s = TILE_SCALE[o.size] || .55;
    const tw = PAGE_W / s, th = PAGE_H / s;
    const cols = Math.ceil(W / tw), rows = Math.ceil(H / th);
    // 讓拼貼的內容置中
    const ox = -pad - (cols * tw - W) / 2, oy = -pad - (rows * th - H) / 2;
    // 總覽頁：整棵樹＋格線編號
    let grid = '';
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const gx = ox + c * tw, gy = oy + r * th;
      grid += `<rect x="${gx}" y="${gy}" width="${tw}" height="${th}" fill="none" stroke="#2f6fb0" stroke-width="${6 / Math.min(PAGE_W / (cols * tw), PAGE_H / (rows * th))}" stroke-dasharray="40 20"/>`;
      grid += `<text x="${gx + tw / 2}" y="${gy + th / 2}" font-size="${th / 4}" font-weight="900" fill="#2f6fb0" opacity=".35" text-anchor="middle" dominant-baseline="middle">${r + 1}-${c + 1}</text>`;
    }
    pages.push({ kind: 'overview', vb: [ox, oy, cols * tw, rows * th], extraBody: grid, title: (rangeName ? rangeName + '・' : '') + '總覽（拼貼對照）' });
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      pages.push({ kind: 'tile', vb: [ox + c * tw, oy + r * th, tw, th], r, c, rows, cols, title: rangeName });
  }
  return { only, L, body, pages, fitS, count: pages.length + (o.roster ? Math.max(1, Math.ceil(((only ? only.size : Object.keys(t.people).length) + 1) / 26)) : 0) };
}
