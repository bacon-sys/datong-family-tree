  const anyStory = list.some(tt => Object.values(tt.people).some(p => (p.story || '').trim()));
  const first = planPages(t, o);
  if (first.fitS < 0.45) o.mode = 'tile';
  const elders = Object.values(t.people).filter(p => FT.childrenOf(p.id, t.people).length)
    .map(p => ({ p, g: FT.generations(t)[p.id] })).sort((a, b) => a.g - b.g)
    .map(({ p }) => `<option value="${p.id}">${esc(FT.kinMap(t)[p.id].zh)}　${esc(displayName(p, t.people) || '（未填）')}</option>`).join('');
  const chips = (key, items) => items.map(([v, l]) => `<button class="chip" data-k="${key}" data-v="${v}">${l}</button>`).join('');
  const m = modal('🖨️ 列印' + (single ? '' : `（${list.length} 份，每份用相同設定）`), `
    ${inFrame ? '<div class="frame-warn">⚠ 你現在是在「預覽視窗」裡打開這個網頁，瀏覽器不允許從這裡直接列印。請按「⬇️ 下載列印檔」，再用 Chrome 或 Edge 打開下載的檔案列印；或把族譜建置系統.html 下載後直接用瀏覽器打開。</div>' : ''}
    <div class="popt">
      ${single ? `<div class="grp"><b>印哪些人</b>${chips('range', [['all', '整個家族'], ['paternal', '爸爸那一邊'], ['maternal', '媽媽那一邊'], ['desc', '某位長輩的後代']])}
        <select id="pRoot" class="hidden">${elders}</select></div>` : ''}
      <div class="grp"><b>版面</b>${chips('mode', [['fit', '縮成一張 A4'], ['tile', '分頁拼貼（字比較大）']])}</div>
      <div class="grp" id="gSize"><b>拼貼字級</b>${chips('size', [['mid', '中'], ['big', '大']])}</div>
      <div class="grp"><b>名冊</b>${chips('roster', [['1', '附上名冊表格'], ['0', '不要']])}</div>
      ${anyStory ? `<div class="grp"><b>小故事</b>${chips('stories', [['1', '附上家族故事頁'], ['0', '不要']])}</div>` : ''}
      <div class="psum" id="pSum"></div>
      <div class="pv-pages" id="pPrev"></div>
    </div>`, [
      { label: '取消' },
      { label: '⬇️ 下載列印檔', cls: inFrame ? 'primary' : '', onClick: () => { downloadPrintDoc(list); } },
      { label: '🖨️ 列印', cls: inFrame ? '' : 'primary', onClick: () => { try { window.print(); } catch (e) { toast('⚠ 這裡不能直接列印，請改用「下載列印檔」', 5000); return false; } } },
    ], { wide: true });
  m.el.querySelector('.modal').style.maxWidth = '1000px';
  const update = () => {
    m.el.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', String(o[c.dataset.k] === true ? '1' : o[c.dataset.k] === false ? '0' : o[c.dataset.k]) === c.dataset.v));
    const sel = m.el.querySelector('#pRoot'); if (sel) { sel.classList.toggle('hidden', o.range !== 'desc'); if (o.range === 'desc' && !o.root) o.root = sel.value; }
    m.el.querySelector('#gSize').classList.toggle('hidden', o.mode !== 'tile');
    renderPages($('#print'), list, o);
    const plan = planPages(t, o);
    const shown = plan.only ? plan.only.size : N;
    const pct = Math.round(plan.fitS * 100);
    let msg = `這次會印 <b>${shown}</b> 人`;
    if (single) msg += `，共 <b>${$('#print').children.length}</b> 張 A4 橫式。`;
    else msg += `（第一份），全部共 <b>${$('#print').children.length}</b> 張 A4。`;
    let warn = false;
    if (o.mode === 'fit') {
      msg += `<br>縮成一張時，字大約是螢幕的 <b>${pct}%</b>。`;
      if (pct < 45) { msg += '人數多、字會很小，建議改用「分頁拼貼」或只印「一邊」。'; warn = true; }
    } else if (plan.pages.length > 1) msg += `<br>拼貼：先看第 1 張「總覽」上的編號，把各張依編號排好，剪掉白邊後黏起來就是一張大族譜。`;
    else msg += '<br>人數不多，一張就放得下，不需要拼貼。';
    const s = $('#pSum'); s.innerHTML = msg; s.classList.toggle('warn', warn);
    $('#pPrev').innerHTML = $('#print').innerHTML;
  };
  m.el.querySelectorAll('.chip').forEach(c => c.onclick = () => {
    const k = c.dataset.k; o[k] = k === 'roster' || k === 'stories' ? c.dataset.v === '1' : c.dataset.v; update();
  });
  const sel = m.el.querySelector('#pRoot'); if (sel) sel.onchange = () => { o.root = sel.value; update(); };
  update();
}
function printTrees(list) { printDialog(list); }
function printCurrent() { if (tree) printDialog([tree]); }

/* ---------- 老師檢視 ---------- */
let classList = load(KEY_CLASS) || [];
// 全班清單存在裝置上時不留相片（太佔空間）；剛匯入、還沒重新整理時仍看得到相片
function saveClass() { store(KEY_CLASS, classList.map(i => ({ key: i.key, data: FT.stripPhotos(i.data) }))); }
function teacherDialog() {
  const sorted = classList.slice().sort((a, b) => String(a.data.student.cls + String(a.data.student.seat).padStart(3, '0')).localeCompare(String(b.data.student.cls + String(b.data.student.seat).padStart(3, '0'))));
  const items = sorted.map(it => {
    const t = it.data, me = t.people[t.meId], st = t.student || {};
    return `<div class="cls-item"><div><div class="nm">${esc(st.cls)} 班 ${esc(st.seat)} 號　${esc(displayName(me, t.people) || '（未填）')}${me.han && FT.tribalName(me, t.people) ? '（' + esc(me.han) + '）' : ''}</div>
      <div class="meta">${Object.keys(t.people).length} 人・${t.updatedAt ? '更新於 ' + new Date(t.updatedAt).toLocaleString('zh-TW') : ''}</div></div>
      <div class="acts"><button class="btn small dark" data-view="${it.key}">檢視</button><button class="btn small" data-print="${it.key}">列印</button><button class="btn small" data-rm="${it.key}">移除</button></div></div>`;
  }).join('') || '<p style="color:#6f625a">還沒有匯入任何學生檔案。</p>';
  const m = modal('👩‍🏫 老師檢視：全班族譜',
    `<div class="welcome-intro">按「匯入學生檔案」，一次選取全班交來的 .json 檔（可以多選）。同一位學生重複匯入，會用新的取代舊的。資料只存在這台裝置。<br>學生的相片只在剛匯入時顯示；重新打開網頁後，清單裡不會保留相片（學生交來的原檔還有）。</div>
     <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" id="tImp">📥 匯入學生檔案</button><button class="btn" id="tAll" ${classList.length ? '' : 'disabled'}>🖨️ 全部列印（${classList.length} 份）</button><button class="btn" id="tClr" ${classList.length ? '' : 'disabled'}>清空清單</button></div>
     <div class="cls-list">${items}</div>`, [{ label: '關閉' }], { wide: true });
  m.el.querySelector('#tImp').onclick = () => { m.close(); $('#fileMany').click(); };
  m.el.querySelector('#tAll').onclick = () => { m.close(); printTrees(sorted.map(i => i.data)); };
  m.el.querySelector('#tClr').onclick = () => { m.close(); confirmBox('清空全班清單？', '<p>只會清掉這台裝置上的清單，學生的檔案不受影響。</p>', '清空', () => { classList = []; saveClass(); teacherDialog(); }, true); };
  m.el.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { m.close(); viewStudent(classList.find(i => i.key === b.dataset.view)); });
  m.el.querySelectorAll('[data-print]').forEach(b => b.onclick = () => { m.close(); printTrees([classList.find(i => i.key === b.dataset.print).data]); });
  m.el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { classList = classList.filter(i => i.key !== b.dataset.rm); saveClass(); m.close(); teacherDialog(); });
}
$('#fileMany').onchange = async e => {
  const files = [...e.target.files]; e.target.value = '';
  let ok = 0; const errs = [];
  for (const f of files) {
    try {
      const d = await readFile(f);
      const key = (d.student.cls || '') + '-' + (d.student.seat || '') + '-' + d.meId;
      classList = classList.filter(i => i.key !== key); classList.push({ key, data: d }); ok++;
    } catch (err) { errs.push(err.message); }
  }
  saveClass();
  document.querySelectorAll('.modal-bg').forEach(m => m.remove());
  teacherDialog();
  toast(`匯入 ${ok} 份` + (errs.length ? `，${errs.length} 份失敗：${errs.join('；')}` : ''), errs.length ? 7000 : 3000);
};
function viewStudent(it) {
  if (!it) return;
  viewing = it; tree = it.data; closePanel();
  const st = tree.student || {}, me = tree.people[tree.meId];
  const bar = $('#roBar');
  bar.innerHTML = `<span>👀 檢視中：${esc(st.cls)} 班 ${esc(st.seat)} 號 ${esc(displayName(me, tree.people))}（唯讀）</span><button class="btn small" id="roPrint">🖨️ 列印</button><button class="btn small" id="roList">全班清單</button><button class="btn small primary" id="roBack">回到我的族譜</button>`;
  bar.classList.remove('hidden');
  $('#roPrint').onclick = () => printTrees([tree]);
  $('#roList').onclick = teacherDialog;
  $('#roBack').onclick = backToMine;
  setEditable(false);
  renderTree(); startView();
}
function backToMine() {
  viewing = null; $('#roBar').classList.add('hidden'); setEditable(true); closePanel();
  tree = mine;
  if (!mine) { $('#cards').innerHTML = ''; $('#lines').innerHTML = ''; renderWho(); welcome(); return; }
  renderTree(); fitView();
}
function setEditable(on) { ['#bExport', '#bImport'].forEach(s => $(s).disabled = !on); }

/* ---------- 找家人 ---------- */
(function finder() {
  const inp = $('#find'), res = $('#findRes');
  const run = () => {
    const q = inp.value.trim().toLowerCase();
    if (!q || !tree) { res.classList.add('hidden'); return; }
    const K = FT.kinMap(tree);
    const hits = Object.values(tree.people).filter(p => [p.given, p.han, FT.tribalName(p, tree.people), K[p.id].zh, K[p.id].term, p.story].some(s => (s || '').toLowerCase().includes(q))).slice(0, 30);
    const inStory = p => ![p.given, p.han, FT.tribalName(p, tree.people), K[p.id].zh, K[p.id].term].some(s => (s || '').toLowerCase().includes(q));
    res.innerHTML = hits.length ? hits.map(p => `<button data-id="${p.id}"><span class="k">${esc(K[p.id].zh)}</span><span><b>${esc(FT.tribalName(p, tree.people) || '')}</b> ${esc(p.han)}${inStory(p) ? ' <span style="color:#7a4f0e;font-size:15px">📖 故事裡有「' + esc(inp.value.trim()) + '」</span>' : ''}</span></button>`).join('') : '<div style="padding:10px 12px;color:#6f625a">找不到</div>';
    res.classList.remove('hidden');
    res.querySelectorAll('button').forEach(b => b.onclick = () => { res.classList.add('hidden'); inp.value = ''; inp.blur(); select(b.dataset.id); focusPerson(b.dataset.id, Math.max(view.s, 0.9)); });
  };
  inp.addEventListener('input', run);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = res.querySelector('button'); if (b) b.click(); } if (e.key === 'Escape') { inp.value = ''; run(); } });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.finder')) res.classList.add('hidden'); });
})();

/* ---------- 工具列 ---------- */
$('#bExport').onclick = exportMine;
$('#bImport').onclick = () => $('#fileOne').click();
$('#bPrint').onclick = printCurrent;
$('#bTerms').onclick = () => tree && termsDialog();
$('#bOrigin').onclick = () => tree && originDialog(tree.meId);
$('#bIn').onclick = () => { const r = $('#vp').getBoundingClientRect(); zoomAt(1.2, r.width / 2, r.height / 2); };
$('#bOut').onclick = () => { const r = $('#vp').getBoundingClientRect(); zoomAt(1 / 1.2, r.width / 2, r.height / 2); };
$('#bFit').onclick = fitView;
$('#bMe').onclick = () => tree && focusPerson(tree.meId, Math.max(view.s, 0.85));
$('#bTeacher').onclick = teacherDialog;
$('#bHelp').onclick = () => modal('❓ 使用說明', `
  <div class="sect">學生</div>
  <ol style="margin:0;padding-left:1.4em">
    <li>第一次打開：填班級、座號、自己的族名或漢名、性別，按「開始」。</li>
    <li><b>點一下任何一張卡片</b>，在旁邊按「＋爸爸」「＋媽媽」「＋哥哥」……就會長出新卡片，在綠色框裡填名字。畫面會停在原本那個人，可以接著一直加。</li>
    <li>每個人可以選<b>族籍</b>（16 族、漢族、新住民或自己填），卡片右下角會顯示。</li>
    <li>點一個人，在「特殊關係」可以標註<b>離婚</b>（夫妻線變成灰色虛線）或<b>收養</b>（綠色虛線，卡片標「收養」）。</li>
    <li>兄弟姊妹的順序排錯了：<b>按住卡片不放，等卡片浮起來</b>，拖到其他兄弟姊妹之間（會出現黃色直線），放開就換好了，排行和「哥哥／弟弟」的稱謂會跟著改。</li>
    <li>放相片：點一個人，按「📷 選相片」，可以拍照或從相簿選。相片會自動縮小、裁成圓形，取代原本的小人圖。</li>
    <li>「🌱 族群來源」會依每位家人填的族籍，算出族群來源（例如泰雅族 3/4、漢族 1/4），也會列出用了誰的族籍。這只是資料計算，不代表一個人「有多少」是哪一族。</li>
    <li>小故事：點一個人，在「📖 小故事」寫下他的故事（最多 300 字）。卡片上會出現「📖 故事」，點一下就能看，還可以「上一則／下一則」依序看全家的故事。列印時可以勾選「附上家族故事頁」。</li>
    <li>過世的家人：點他的卡片，勾選「<b>已過世</b>」，卡片會變成灰色並標示「已過世」。</li>
    <li>族名欄<b>只填這個人自己的名字</b>，爸爸的名字會自動接在後面（子連父名）。家裡寫法不一樣時，到「更多設定」自己打完整族名。</li>
    <li>資料會<b>自動存在這台裝置</b>。做完或下課前，按「💾 匯出檔案」，把檔案交給老師。</li>
    <li>換平板或資料不見時，按「📂 開啟檔案」打開之前匯出的檔案，就能接著做。</li>
    <li>要換人使用或重新做一份：按「🧹 清除資料」（小螢幕在「☰ 更多」裡，記得先匯出）。</li>
  </ol>
  <div class="sect">老師</div>
  <ol style="margin:0;padding-left:1.4em">
    <li>按「👩‍🏫 老師檢視」→「匯入學生檔案」，可以一次選全班的檔案。</li>
    <li>每位學生可以「檢視」「列印」，也可以「全部列印」。列印時可以選：縮成一張 A4、或分頁拼貼（字比較大，印好再黏成大張）；也可以只印爸爸那邊、媽媽那邊，或某位長輩的後代；可附上名冊表格。</li>
    <li>家族很大時，用上方「🔍 找家人」輸入名字，就會跳到那個人。</li>
    <li>如果按列印沒有反應（例如在預覽視窗裡打開），請在列印視窗按「⬇️ 下載列印檔」，用 Chrome 或 Edge 打開再印。</li>
    <li>「🗣️ 稱謂表」可以修改族語稱謂，改過的稱謂會跟著檔案走。</li>
  </ol>
  <div class="welcome-intro">提醒：家人的名字屬於個人資料，匯出的檔案請交給老師就好，不要上傳到公開的網路空間。</div>`, [{ label: '知道了', cls: 'primary' }], { wide: true });
$('#bNew').onclick = clearDialog;
(function moreMenu() {
  const menu = $('#moreMenu');
  const items = [['#bImport', '📂 開啟檔案'], ['#bTerms', '🗣️ 稱謂表'], ['#bOrigin', '🌱 族群來源'], ['#bHelp', '❓ 說明'], ['#bTeacher', '👩‍🏫 老師檢視'], ['#bNew', '🧹 清除資料']];
  $('#bMore').onclick = e => {
    e.stopPropagation();
    if (!menu.classList.contains('hidden')) { menu.classList.add('hidden'); return; }
    menu.innerHTML = items.map(([s, l]) => `<button data-s="${s}" ${$(s).disabled ? 'disabled' : ''}>${l}</button>`).join('');
    if (window.innerWidth <= 600) menu.style.top = ($('#toolbar').getBoundingClientRect().bottom + 4) + 'px'; else menu.style.top = '';
    menu.classList.remove('hidden');
    menu.querySelectorAll('button').forEach(b => b.onclick = () => { menu.classList.add('hidden'); $(b.dataset.s).click(); });
  };
  document.addEventListener('pointerdown', e => { if (!e.target.closest('.morewrap')) menu.classList.add('hidden'); });
})();
function clearDialog() {
  const nMine = mine ? Object.keys(mine.people).length : 0, nClass = classList.length;
  if (!nMine && !nClass) { toast('這台裝置上沒有存任何族譜資料'); return; }
  const me = mine && mine.people[mine.meId];
  const m = modal('🧹 清除這台裝置上的資料', `
    <p style="margin:0">勾選要清除的資料（網頁本身不會被刪掉）：</p>
    ${nMine ? `<label class="check" style="font-size:18px"><input type="checkbox" id="cMine" checked> 我的族譜：${esc(displayName(me, mine.people) || '（未填名字）')}，共 ${nMine} 人</label>` : ''}
    ${nClass ? `<label class="check" style="font-size:18px"><input type="checkbox" id="cClass" ${nMine ? '' : 'checked'}> 老師匯入的全班清單：${nClass} 份</label>` : ''}
    ${nMine ? `<div class="welcome-intro">清除後<b>無法復原</b>。如果之後還要用，請先按「💾 先匯出」把族譜存成檔案。<br><button class="btn small" id="cExp" style="margin-top:6px">💾 先匯出我的族譜</button></div>` : ''}
    <div id="cErr" style="color:#a8231c;font-weight:700"></div>`,
    [{ label: '取消' },
     { label: '確定清除', cls: 'primary', onClick: bg => {
        const cm = bg.querySelector('#cMine'), cc = bg.querySelector('#cClass');
        const doMine = !!(cm && cm.checked), doClass = !!(cc && cc.checked);
        if (!doMine && !doClass) { bg.querySelector('#cErr').textContent = '請至少勾一項'; return false; }
        clearLocal(doMine, doClass);
      } }]);
  const ex = m.el.querySelector('#cExp'); if (ex) ex.onclick = exportMine;
}
function clearLocal(doMine, doClass) {
  try {
    if (doMine) localStorage.removeItem(KEY_MINE);
    if (doClass) localStorage.removeItem(KEY_CLASS);
    if (doMine && doClass) Object.keys(localStorage).filter(k => k.startsWith('datongFT.')).forEach(k => localStorage.removeItem(k));
  } catch (e) {}
  if (doClass) classList = [];
  // 正在檢視學生時，先回到自己的畫面
  const wasViewing = !!viewing;
  if (viewing && (doClass || doMine)) { viewing = null; $('#roBar').classList.add('hidden'); setEditable(true); }
  closePanel(); $('#print').innerHTML = ''; layoutCache.key = '';
  if (doMine) {
    mine = null; tree = null; savedAt = null;
    $('#cards').innerHTML = ''; $('#lines').innerHTML = ''; renderWho();
    welcome();
    toast(doClass ? '已清除我的族譜和全班清單，可以重新開始了' : '已清除，可以重新建立新的族譜了', 4000);
  } else {
    if (wasViewing) { tree = mine; if (mine) { renderTree(); startView(); } }
    toast('已清除全班清單');
  }
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const ms = document.querySelectorAll('.modal-bg');
  if (ms.length) { const top = ms[ms.length - 1]; if (!top.dataset.locked) top.remove(); return; }
  if (document.activeElement && document.activeElement.id === 'find') return;
  closePanel();
});

/* ---------- 版面高度 ---------- */
function sizeMain() { const top = $('#toolbar').getBoundingClientRect().bottom; $('#main').style.top = top + 'px'; }
window.addEventListener('resize', () => { sizeMain(); });
try { new ResizeObserver(sizeMain).observe($('#toolbar')); new ResizeObserver(sizeMain).observe($('#top')); } catch (e) {}


/* ---------- 啟動 ---------- */
sizeMain();
const saved = load(KEY_MINE);
if (saved) {
  try { mine = FT.validate(saved); tree = mine; renderTree(); startView(); } catch (e) { mine = null; }
}
if (!mine) welcome();
renderWho();
window.__ft = { get tree() { return tree; }, FT };
})();
</script>
